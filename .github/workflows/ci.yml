name: CI

# Phase 0 gates only (docs/architecture/technical-plan.md). Project and model
# gates are added as their phases land — a workflow step referencing work that
# does not exist yet is a green check that means nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Secret scanning must see history: the working tree cannot show
          # what a previous commit already published.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        # The interpreter is pinned by .python-version, not left to whatever
        # the runner image ships. Unpinned, CI resolved 3.12 while local
        # resolved 3.11, and mypy — told to parse as 3.11 — choked on numpy
        # stubs written in 3.12 syntax. Local green then meant nothing about
        # CI, which is the failure mode this repository has already hit once.
        #
        # 3.11 specifically: it is the declared floor in requires-python, and
        # the floor is the version most likely to break unnoticed.
        with:
          enable-cache: true

      - name: Sync workspace
        id: sync
        # --all-packages, not just --all-extras: without it uv installs the
        # ROOT project's dependencies only, and every workspace member's
        # dependencies are missing. mypy then reports "cannot find polars" for
        # code that runs fine locally.
        #
        # This diverged for several commits because the local command was
        # changed and the workflow was not — the exact class of drift this
        # repository keeps finding, in the file that verifies everything else.
        run: uv sync --all-packages --all-extras

      - name: Lockfile is current
        run: uv lock --check

      - name: Dependency direction (ADR-001)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/test_dependency_direction.py -q

      - name: Lint and format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # scripts/ is in scope deliberately. It holds the gates that enforce
        # every other claim in this repository, and it was the code the type
        # gate did NOT check — 26 errors sat there while the step reported
        # green. A gate scoped away from the gates is not a gate.
        run: uv run mypy libs/ scripts/ projects/demand-forecast/src/

      - name: Agentic surface is current
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # --check, never a write: a commit must not be able to carry a
        # canonical change without its four rendered surfaces.
        run: uv run python scripts/sync_agentic_adapters.py --check

      - name: Agentic surface integrity
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Parity across claude/cursor/codex/devin, a declared AUTO/CONSULT/STOP
        # mode per skill, no mode de-escalation in a mirror, no policy text in
        # a pointer.
        run: uv run python scripts/validate_agentic_surface.py --strict

      - name: Documentation coherence (ADR-005)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_doc_coherence.py

      - name: CI references resolve
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # A workflow calling a renamed script silently stops testing what it
        # claims to test, while still showing up in a green build.
        run: uv run python scripts/check_ci_references.py

      - name: Technology inventory matches the filesystem
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # "Is the platform ready?" must not be answerable by an impression.
        # Detectors never match documentation: the easiest way to appear
        # finished is to write about being finished.
        run: uv run python scripts/check_technology_inventory.py --check

      - name: Implementation status matches the filesystem
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # The plan states intent; this derives what exists. A stale table is a
        # document asserting something false, which is itself a defect.
        run: uv run python scripts/check_implementation_status.py --check

      - name: Tests with coverage (L1/L2 — libs)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # THE declared gate. quality-gates.md L1/L2 say >=90% lines and >=80%
        # branches FOR libs/, and this measures exactly that scope.
        #
        # It previously measured libs+scripts+projects against the same 90,
        # so the gate that was declared (libs, passing at 93%) and the gate
        # that ran (everything, failing at 78%) were different gates. Two
        # scopes need two thresholds, not one threshold applied to whichever
        # scope the command happened to name.
        run: |
          uv run pytest libs/ -q \
            --cov=libs --cov-branch \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=90

      - name: Tests with coverage (L3 — gate scripts)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # scripts/ enforces every other claim in this repository and had no
        # coverage floor at all; two of its files sat at 0% while a green
        # step implied otherwise.
        #
        # 74% is a RATCHET floor, set at what the suite measures TODAY
        # (74.65%) rather than at an aspiration nothing meets — a floor above
        # the measurement is a red build, not a standard. It is not a
        # relaxation of L1/L2: no threshold for scripts/ existed before this
        # line, which is how two files reached 0%. Raise it as coverage rises;
        # never lower it (P-10, and a STOP in AGENTS.md).
        run: |
          uv run pytest -q \
            --cov=scripts --cov-branch \
            --cov-report=term \
            --cov-fail-under=74

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false   # a Codecov outage must not block a merge
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: MCP registry
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_mcp_registry.py

      - name: Project generator renders a usable project
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # templates/project/ is excluded from lint and the dependency test
        # because Jinja is not valid Python. That exclusion is only defensible
        # if something renders it — otherwise the generator is the one
        # directory nothing checks, and every future project comes from it.
        run: uv run pytest tests/test_project_generator.py -q

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        # Covers what gitleaks and dependabot do not: IaC misconfiguration and
        # vulnerabilities in transitive dependencies the lockfile pulled in.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # Report rather than block, for now: a CRITICAL in a transitive dep
          # with no available fix would otherwise block every unrelated merge.
          # Promoted to blocking once the finding volume is known — which is a
          # measurement, not a guess.
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
