name: CI

# Phase 0 gates only (docs/architecture/technical-plan.md). Project and model
# gates are added as their phases land — a workflow step referencing work that
# does not exist yet is a green check that means nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Secret scanning must see history: the working tree cannot show
          # what a previous commit already published.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Lockfile is current
        run: uv lock --check

      - name: Dependency direction (ADR-001)
        run: uv run pytest tests/test_dependency_direction.py -q

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy libs/

      - name: Agentic surface is current
        # --check, never a write: a commit must not be able to carry a
        # canonical change without its four rendered surfaces.
        run: uv run python scripts/sync_agentic_adapters.py --check

      - name: Agentic surface integrity
        # Parity across claude/cursor/codex/devin, a declared AUTO/CONSULT/STOP
        # mode per skill, no mode de-escalation in a mirror, no policy text in
        # a pointer.
        run: uv run python scripts/validate_agentic_surface.py --strict

      - name: Documentation coherence (ADR-005)
        run: uv run python scripts/check_doc_coherence.py

      - name: CI references resolve
        # A workflow calling a renamed script silently stops testing what it
        # claims to test, while still showing up in a green build.
        run: uv run python scripts/check_ci_references.py

      - name: Technology inventory matches the filesystem
        # "Is the platform ready?" must not be answerable by an impression.
        # Detectors never match documentation: the easiest way to appear
        # finished is to write about being finished.
        run: uv run python scripts/check_technology_inventory.py --check

      - name: Implementation status matches the filesystem
        # The plan states intent; this derives what exists. A stale table is a
        # document asserting something false, which is itself a defect.
        run: uv run python scripts/check_implementation_status.py --check

      - name: Tests
        run: uv run pytest -q

      - name: Project generator renders a usable project
        # templates/project/ is excluded from lint and the dependency test
        # because Jinja is not valid Python. That exclusion is only defensible
        # if something renders it — otherwise the generator is the one
        # directory nothing checks, and every future project comes from it.
        run: uv run pytest tests/test_project_generator.py -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
