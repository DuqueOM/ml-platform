name: CI

# Phase 0 gates only (docs/architecture/technical-plan.md). Project and model
# gates are added as their phases land — a workflow step referencing work that
# does not exist yet is a green check that means nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Secret scanning must see history: the working tree cannot show
          # what a previous commit already published.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        # The interpreter is pinned by .python-version, not left to whatever
        # the runner image ships. Unpinned, CI resolved 3.12 while local
        # resolved 3.11, and mypy — told to parse as 3.11 — choked on numpy
        # stubs written in 3.12 syntax. Local green then meant nothing about
        # CI, which is the failure mode this repository has already hit once.
        #
        # 3.11 specifically: it is the declared floor in requires-python, and
        # the floor is the version most likely to break unnoticed.
        with:
          enable-cache: true

      - name: Install Terraform
        # Not optional. Without the binary, tests/test_cloud_surface.py skips
        # ENTIRELY — so `terraform validate` never ran in CI for either
        # adapter, and the coverage of measure_cloud_surface.py dropped below
        # its floor. A test suite that silently skips its subject reports
        # success for doing nothing, which is the failure this repository keeps
        # finding in other forms.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Sync workspace
        id: sync
        # --all-packages, not just --all-extras: without it uv installs the
        # ROOT project's dependencies only, and every workspace member's
        # dependencies are missing. mypy then reports "cannot find polars" for
        # code that runs fine locally.
        #
        # This diverged for several commits because the local command was
        # changed and the workflow was not — the exact class of drift this
        # repository keeps finding, in the file that verifies everything else.
        #
        # `--locked` is what makes the step below able to fail. Without it,
        # `uv sync` UPDATES the lockfile when it does not match
        # `pyproject.toml`, and the next step then checks a file the previous
        # step had just repaired — a gate that cannot fail, which is P-09
        # wearing a two-step costume.
        #
        # Measured: Dependabot raised `pre-commit` in `pyproject.toml` and left
        # `uv.lock` untouched (its pip ecosystem does not know about uv
        # workspaces). Both pull requests went green and merged, and `main`
        # then failed `uv lock --check` on a clean checkout — while CI kept
        # reporting the lockfile current, because it was, by the time it was
        # asked.
        run: uv sync --all-packages --all-extras --locked

      - name: Lockfile is current
        # Kept even though `--locked` above now enforces it, because the two
        # fail differently: sync fails at setup with a resolver error, this
        # names the invariant. Deleting it would leave the guarantee resting
        # on a flag nobody reads as a check.
        run: uv lock --check

      - name: Dependency direction (ADR-001)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/test_dependency_direction.py -q

      - name: Lint and format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # scripts/ is in scope deliberately. It holds the gates that enforce
        # every other claim in this repository, and it was the code the type
        # gate did NOT check — 26 errors sat there while the step reported
        # green. A gate scoped away from the gates is not a gate.
        run: uv run mypy libs/ scripts/ projects/demand-forecast/src/ projects/rag-assistant/src/

      - name: Agentic surface is current
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # --check, never a write: a commit must not be able to carry a
        # canonical change without its four rendered surfaces.
        run: uv run python scripts/sync_agentic_adapters.py --check

      - name: Agentic surface integrity
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Parity across claude/cursor/codex/devin, a declared AUTO/CONSULT/STOP
        # mode per skill, no mode de-escalation in a mirror, no policy text in
        # a pointer.
        run: uv run python scripts/validate_agentic_surface.py --strict

      - name: Documentation coherence (ADR-005)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_doc_coherence.py

      - name: Upstream parity ledger (ADR-003)
        # The offline half only: CI has no sibling template checkout, so the
        # comparison against upstream is skipped and SAID to be skipped. What
        # runs here is the half that always can — every `adopted` exists, every
        # `rejected` is absent, every entry carries an argument.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_upstream_parity.py

      - name: Clock isolation (tests and git date filters)
        # Tests must not read the wall clock, and production code must not hand
        # git a bare --since date: approxidate fills the missing time from the
        # current clock, so check C7 reported 18 commits at 13:33 and 10 at
        # 21:19 from one commit — a gate that cleared itself in the evening.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_test_clock_isolation.py

      - name: Bandit — security lint over first-party Python
        # Configured in pyproject.toml since this repo began and invoked by
        # NOTHING until now: argued suppressions for a scan nobody ran. `-ll`
        # blocks on MEDIUM and above; the two LOW findings are asserts in
        # scripts/, which nothing runs with `-O`, and leaving the rule enabled
        # means the next one in library code is reported rather than absorbed.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uvx bandit -c pyproject.toml -r libs/ scripts/ projects/ -ll -q

      - name: Version is consistent across every location
        # Five places assert the platform version and nothing compared them.
        # A half-applied bump ships correct release notes with a stale agent
        # entry point, and the workflow that publishes reads a different file
        # from the one the gates read.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_version_consistency.py

      - name: CI references resolve
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # A workflow calling a renamed script silently stops testing what it
        # claims to test, while still showing up in a green build.
        run: uv run python scripts/check_ci_references.py

      - name: YAML parses across the whole repository
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # `check-yaml` in .pre-commit-config.yaml looks like it covers this and
        # does not: pre-commit hands its hooks the STAGED file list, so a
        # manifest no commit has touched since it was written has never been
        # parsed, and no workflow invoked the hook at all. This parses all 172
        # of them, and rejects the duplicate key PyYAML accepts while silently
        # dropping the first value — in a Kubernetes manifest, the object that
        # deploys then differs from the file that was reviewed.
        run: uv run python scripts/ci_verify_yaml.py

      - name: Secret scanner is pinned and consistent
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # SECURITY.md publishes one claim about secret scanning and two
        # binaries stand behind it — the pre-commit hook and the one
        # gitleaks-action installs. gitleaks changed its config dialect at
        # 8.25, so a mismatch means two scans of the same tree under different
        # allowlist rules with neither side reporting it. Also fails on a
        # mutable action tag: a subverted scanner reports no leaks, which is
        # the same output as a clean tree.
        run: uv run python scripts/check_gitleaks_pin.py

      - name: Every third-party action is pinned to a commit
        if: ${{ !cancelled() }}
        # The generalisation of the step above. That argument — a mutable tag
        # is a moving reference to code that runs with the job's token — was
        # never specific to gitleaks, and when this landed the repository ran
        # eight actions on tags, three of them scanners.
        run: uv run python scripts/check_action_pins.py

      - name: Shared library reuse (charter C1)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Reports the reuse count per project and FAILS on a manifest that
        # disagrees with the code — a library declared and never imported, or
        # imported and never declared. It found both on its first run.
        run: uv run python scripts/check_library_reuse.py

      - name: Technology inventory matches the filesystem
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # "Is the platform ready?" must not be answerable by an impression.
        # Detectors never match documentation: the easiest way to appear
        # finished is to write about being finished.
        run: uv run python scripts/check_technology_inventory.py --check

      - name: Implementation status matches the filesystem
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # The plan states intent; this derives what exists. A stale table is a
        # document asserting something false, which is itself a defect.
        run: uv run python scripts/check_implementation_status.py --check

      - name: Tests with coverage (L1/L2 — libs)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # THE declared gate. quality-gates.md L1/L2 say >=90% lines and >=80%
        # branches FOR libs/, and this measures exactly that scope.
        #
        # It previously measured libs+scripts+projects against the same 90,
        # so the gate that was declared (libs, passing at 93%) and the gate
        # that ran (everything, failing at 78%) were different gates. Two
        # scopes need two thresholds, not one threshold applied to whichever
        # scope the command happened to name.
        run: |
          uv run pytest libs/ -q \
            --cov=libs --cov-branch \
            --cov-report=term --cov-report=xml \
            --cov-fail-under=90

      - name: Coverage floors L1 and L2, read separately
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # `--cov-fail-under` above tests one COMBINED figure that mixes
        # statements and branches. L1 and L2 are two thresholds — >=90% lines
        # and >=80% branches — and a suite could fall under the branch floor
        # while clearing the combined number on line coverage alone. Round
        # seven: "L2 declares >=80% branches but no command can fail on
        # branches alone."
        run: uv run python scripts/check_branch_coverage.py

      - name: Tests with coverage (P12 — gate scripts)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # scripts/ enforces every other claim in this repository and had no
        # coverage floor at all; two of its files sat at 0% while a green
        # step implied otherwise.
        #
        # 74% is a RATCHET floor, set at what the suite measures TODAY
        # (74.65%) rather than at an aspiration nothing meets — a floor above
        # the measurement is a red build, not a standard. It is not a
        # relaxation of L1/L2: no threshold for scripts/ existed before this
        # line, which is how two files reached 0%. Raise it as coverage rises;
        # never lower it (P-10, and a STOP in AGENTS.md).
        run: |
          uv run pytest -q \
            --cov=scripts --cov-branch \
            --cov-report=term \
            --cov-fail-under=74

      - name: Upload coverage
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false   # a Codecov outage must not block a merge
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Cloud-specific surface is measured and within budget
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Phase 2's claim is that the multi-cloud DIFFERENCE is isolated and
        # counted, so the count is a gate. A share that drifts upward is the
        # observable signal the abstraction is leaking, and it arrives as a
        # number rather than as an impression during review.
        run: uv run python scripts/measure_cloud_surface.py --check

      - name: GitOps overlays build
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Every overlay in the environment x cloud matrix renders. An overlay
        # that stops building is an Application that syncs to nothing and
        # reports Healthy, which is how a matrix loses a member unnoticed.
        run: |
          for overlay in platform/kubernetes/overlays/*/; do
            kubectl kustomize "$overlay" > /dev/null
          done

      - name: Quality-gate thresholds have not been loosened
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # AGENTS.md calls lowering a threshold a STOP operation and nothing
        # enforced it — an audit put it plainly: STOP declared everywhere,
        # applied nowhere. Compares against HEAD rather than a committed list,
        # because a list of expected values is another literal editable in the
        # same commit as the threshold.
        run: uv run python scripts/check_thresholds.py

      - name: MCP registry
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/check_mcp_registry.py

      - name: Gate declarations are well formed
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Check C4 resolves the COMMANDS a gate row names. This resolves the
        # declarations themselves: unique ids, a threshold, and a recorded
        # reason for it. `P6` named two rows when this landed, while codecov,
        # this workflow and the compliance mapping all cite gates by id.
        run: uv run python scripts/validate_quality_gates.py

      - name: Dashboard inventory
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # `make local-dashboards` provisions the directory wholesale, so the
        # invariants that matter are the ones between files — a shared uid
        # means one dashboard silently replaces another, which no per-file
        # test can see.
        run: uv run python scripts/check_dashboard_inventory.py

      - name: Security baselines are dated, owned and in date
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Every baseline file is empty today. The step is here so the FIRST
        # suppression is held to the contract .security-baselines/README.md
        # states, rather than being the one that arrives before the check does.
        run: uv run python scripts/check_baselines_expiry.py

      - name: Project generator renders a usable project
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # templates/project/ is excluded from lint and the dependency test
        # because Jinja is not valid Python. That exclusion is only defensible
        # if something renders it — otherwise the generator is the one
        # directory nothing checks, and every future project comes from it.
        run: uv run pytest tests/test_project_generator.py -q

  iac-security:
    name: IaC and Kubernetes security
    runs-on: ubuntu-latest
    # The two layers this repository lacked while adding 268 lines of Terraform
    # and six Kubernetes overlays in a single session. Everything else — bandit,
    # ruff, dependabot, gitleaks, trivy — covers Python, dependencies, secrets
    # and images. Nothing looked at the infrastructure that provisions them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkov — Terraform and Kubernetes misconfiguration
        # Static only: it reads the definitions, provisions nothing, and needs
        # no credentials, so it runs while the cloud work is deliberately
        # paused. soft_fail on the FIRST run only — an unread wall of findings
        # is a gate people switch off, and the triage is a separate commit.
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: platform/
          framework: terraform,kubernetes
          soft_fail: true
          output_format: cli

      - name: Kubescape — cluster posture against NSA and CIS baselines
        # Scans the MANIFESTS, not a live cluster. The overlays declare
        # restricted Pod Security and default-deny NetworkPolicies; this checks
        # whether the declaration survives contact with a published baseline.
        continue-on-error: true
        run: |
          curl -sSL https://github.com/kubescape/kubescape/releases/latest/download/kubescape-ubuntu-latest -o kubescape
          chmod +x kubescape
          for overlay in platform/kubernetes/overlays/*/; do
            kubectl kustomize "$overlay" > /tmp/rendered.yaml
            ./kubescape scan framework nsa,cis-v1.10.0 /tmp/rendered.yaml --format pretty-printer || true
          done

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan
        # Vulnerabilities in dependencies the lockfile pulled in, and secrets.
        # NOT IaC misconfiguration: `scan-type: fs` runs the vuln and secret
        # scanners, and misconfig is opt-in. The previous comment claimed it,
        # which is how SECURITY.md came to claim it too.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # BLOCKING. The previous `exit-code: "0"` said "promoted once the
          # finding volume is known — which is a measurement, not a guess", and
          # the measurement now exists: a CI-equivalent scan reports zero
          # CRITICAL or HIGH findings.
          #
          # The risk that comment named — a CRITICAL in a transitive dep with no
          # fix blocking every unrelated merge — is now handled rather than
          # avoided: `.security-baselines/.trivyignore` is where such a finding
          # is accepted, with an owner and an expiry, and an expired entry fails
          # `tests/test_governance_files.py`. That did not exist when this was
          # written.
          trivyignores: .security-baselines/.trivyignore

      - uses: github/codeql-action/upload-sarif@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          sarif_file: trivy.sarif

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned by commit SHA, not by the `v3` tag it previously used. This
        # action is third-party JavaScript that reads the full history with a
        # token, and a tag is a mutable pointer: re-pointing it swaps the
        # scanner without a commit here. What makes that worse than for any
        # other action is the failure mode — a subverted secret scanner does
        # not error, it reports no leaks, which is byte-identical to a pass.
        # `hashicorp/setup-terraform` above was already pinned this way.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The version CI actually scans with. Without this the action falls
          # back to a version hard-coded inside its own source, so the binary
          # was a property of whichever commit the tag resolved to and could
          # not be compared against the pre-commit hook's `rev`. gitleaks
          # changed its config dialect at 8.25 — below it the `[[allowlists]]`
          # form `.gitleaks.toml` documents is ignored in silence — so two
          # scanners straddling that boundary apply different rules to the same
          # tree and neither says so. Kept equal to the hook's rev by
          # `scripts/check_gitleaks_pin.py`; no `v` prefix, per the action.
          GITLEAKS_VERSION: "8.30.0"
