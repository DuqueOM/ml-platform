name: Dependabot auto-merge

# Merge low-risk dependency updates when CI is green; leave majors to a human.
#
# Why this exists (upstream ADR-052, adopted in docs/governance/upstream-parity.yaml):
# reviewing every Dependabot PR by hand does not scale and does not add
# judgement. CI already answers "does this break anything"; a human is needed
# for "should this boundary move", which is what a major usually asks.
#
# What this repository adds: every merge is one of the ten commits C7 allows
# between QA-4 rounds, so an unattended merge spends a budget.
# `scripts/dependabot_merge_budget.py` holds the rule — one commit authored by
# Dependabot per audit window, never into the window's last two, a security
# update outside the quota but inside the floor — and its docstring records why
# each number is what it is.
#
# Two workflows, because the jobs need opposite things (QA-4 round twenty, P2-1),
# and two FILES because a job skipped by `if:` reports success: in one file,
# the `pull_request_target` run would carry a skipped — successful — copy of
# the required check under the same name:
#
# `budget` (dependabot-merge-budget.yml) is the REQUIRED status check "Dependabot merge budget". It runs on
#   `pull_request` with a read-only token. GitHub takes that event's workflow
#   file and every `uses:` from the pull request itself, so a Dependabot bump of
#   an action runs the bumped action here — which is why this job may only
#   compute a verdict, never write. Its threat is the one every CI job has: a
#   subverted action could falsify its own result.
# `queue` (this file) runs on `pull_request_target`, whose workflow file and pins are
#   `main`'s. It holds the write permissions and never checks out, builds or
#   runs anything from the pull request — that is the event's one rule.
#
# What re-checks the budget after `main` moves (QA-4 round twenty, P2-2): not a
# `push` job. A merge GitHub performs for an auto-merge queued with
# GITHUB_TOKEN is a push by GITHUB_TOKEN, and GITHUB_TOKEN events start no
# workflow, so a job on `push` never ran after an auto-merge. The enforcement is
# branch protection: the budget is a required check, and `strict: true` keeps
# every queued pull request out of date — unmergeable — until it is updated,
# which re-runs `budget` against the `main` it would land on.
# `tests/test_dependabot_merge_budget.py` holds both settings in
# `scripts/setup_branch_protection.sh`.
on:
  pull_request_target:

permissions: {}

# `bash -eo pipefail`: GitHub's default step shell has no pipefail, so a failing
# `gh` call inside a pipe or a test went unnoticed (QA-4 round twenty, P3-3).
defaults:
  run:
    shell: bash

jobs:
  queue:
    name: Queue merge for non-major updates
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # enable auto-merge
      pull-requests: write   # enable auto-merge, label a held security update
    steps:
      - name: Read Dependabot's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `main`, explicitly: `pull_request_target` checks out the base by
      # default, and naming it keeps a later edit from reaching for the head.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Queue, or say why not
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            echo "::notice::Major update — not auto-merged. A major asks whether a boundary should move, which CI cannot answer."
            exit 0
          fi
          status=0
          answer=$(uv run --locked --no-dev --package ml-platform python scripts/dependabot_merge_budget.py) || status=$?
          echo "$answer"
          case "$status" in
            0)
              gh pr merge --auto --squash "$PR_URL"
              echo "::notice::Auto-merge queued. GitHub merges it once every required check passes, the budget included." ;;
            1)
              if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
                gh pr merge --disable-auto "$PR_URL"
              fi
              if [[ "$answer" == *"SECURITY update"* ]] && \
                 [ "$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | index("security") != null')" != "true" ]; then
                gh pr edit "$PR_URL" --add-label security
                gh pr comment "$PR_URL" --body "Security update held: ${answer#*— }"
              fi
              echo "::notice::Not queued (see the budget line above)." ;;
            *)
              echo "::error::The budget could not be answered; nothing queued. See the line above."
              exit 1 ;;
          esac
