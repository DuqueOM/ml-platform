# Publish a GitHub Release whenever a version tag is pushed.
#
# ml-service-template added this after an audit found SIX tags with zero
# published Releases: the history existed in git and was invisible to anyone
# using the Releases UI. Inherited here before the same thing can happen,
# rather than after.
name: Release on tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # notes are generated from the commit range

      - name: Extract the CHANGELOG section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Stop at the next H2 of ANY kind, not only the next VERSION
          # heading. The earlier `/^## \[/` exit condition meant a non-version
          # H2 — "## Cadence note" — did not end the section, so publishing
          # v0.1.0 would have carried every following section into the release
          # notes. Nothing caught it because the workflow had never run.
          #
          # No `|| true`: awk failing here must fail the release, not produce
          # an empty file that the next check then blames on the CHANGELOG.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            # A tag with no CHANGELOG section is a release nobody described.
            # Fail rather than publishing an empty one — an empty release is
            # worse than a late one, because it looks complete.
            echo "::error::no CHANGELOG.md section found for version $version"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
