# OpenSSF Scorecard — supply-chain posture, measured by someone else's rubric.
#
# The value is precisely that the rubric is EXTERNAL. Every other gate in this
# repository was written here, so every one of them reflects assumptions made
# here. Scorecard checks things nobody here chose to check: token permissions,
# pinned dependencies, branch protection, dangerous workflow patterns.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # weekly; posture drifts slowly
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
