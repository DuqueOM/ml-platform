# OpenSSF Scorecard — supply-chain posture, measured by someone else's rubric.
#
# The value is precisely that the rubric is EXTERNAL. Every other gate in this
# repository was written here, so every one of them reflects assumptions made
# here. Scorecard checks things nobody here chose to check: token permissions,
# pinned dependencies, branch protection, dangerous workflow patterns.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # weekly; posture drifts slowly
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # A bound, not a budget: measured 1.2 min median, 1.4 max, over the last five
    # green runs. Checked before adding, because Scorecard rejects published
    # results from a workflow that breaks its rules: `verifyScorecardWorkflow`
    # in ossf/scorecard-webapp inspects global env/defaults, permissions, the
    # job's container, services, runs-on, env, defaults and step `uses` — never
    # timeout-minutes (QA-4 round eleven).
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
