# =============================================================================
# Agentic manifest — the index that drives adapter rendering.
# =============================================================================
# READ-ONLY INDEX. It never contains policy text: canonical bodies live in
# agentic/{rules,skills,workflows}/ and nowhere else.
#
#   scripts/sync_agentic_adapters.py     renders the surfaces below
#   scripts/validate_agentic_surface.py  fails CI when they drift
#
# Two render modes, because the tools differ in kind:
#   pointer  — the surface file names its canonical source and nothing more.
#              Used where the tool can follow a path.
#   mirror   — the surface file carries the full canonical body, with a
#              generated header. Used where the tool ingests file contents and
#              cannot follow a pointer. A mirror is drift-checked byte for byte;
#              a stale mirror is a CI failure, never a silent divergence.
# =============================================================================
version: 1

# -----------------------------------------------------------------------------
# Authority chain. Every policy claim in a rule, skill or workflow resolves to
# one of these. The validator rejects a surface whose authority does not.
# -----------------------------------------------------------------------------
canonical:
  behavior_protocol:
    path: AGENTS.md
    authority: "AGENTS.md#Agent Behavior Protocol"
  anti_patterns:
    path: AGENTS.md
    authority: "AGENTS.md#Anti-patterns"
  invariants:
    path: AGENTS.md
    authority: "AGENTS.md#Invariants — never violate"
  quality_gates:
    path: docs/governance/quality-gates.md
    authority: docs/decisions/ADR-005-agentic-governance.md
  qa_procedures:
    path: docs/governance/qa-procedures.md
    authority: docs/decisions/ADR-005-agentic-governance.md
  tooling_triage:
    path: docs/decisions/ADR-004-tooling-triage.md
    authority: docs/decisions/ADR-004-tooling-triage.md
  topology:
    path: docs/decisions/ADR-001-monorepo-topology.md
    authority: docs/decisions/ADR-001-monorepo-topology.md

# -----------------------------------------------------------------------------
# Canonical stores. Single source of truth for every surface.
# -----------------------------------------------------------------------------
stores:
  rules:
    path: agentic/rules
    glob: "*.md"
  skills:
    path: agentic/skills
    glob: "*/SKILL.md"
  workflows:
    path: agentic/workflows
    glob: "*.md"

# -----------------------------------------------------------------------------
# Context files — the orientation an agent needs on attaching, GENERATED like
# every other surface file.
#
# Hand-writing them was the obvious alternative and it is the one upstream
# took; its `.cursor_context.md` claims 14 rule files where 19 exist and its
# `.devin_context.md` claims 15 rules, 16 skills and 12 workflows where 19, 27
# and 20 exist. Nothing caught it, because a hand-written file about a
# generated tree has no gate that can. Every fact below is derived from this
# manifest, the stores, and `mcp_registry.yaml`; the only prose stored here is
# the part that is genuinely tool-specific and therefore not derivable.
# -----------------------------------------------------------------------------
context:
  # Shared, tool-agnostic. Carries the surface inventory and nothing else — it
  # is not a second constitution, and the four per-tool files point at it so
  # that the shared half exists once.
  shared: AGENT_CONTEXT.md
  # Per-surface MCP facts (config path, which servers need confirmation) are
  # read from here rather than restated, for the same reason as everything else.
  mcp_registry: agentic/mcp_registry.yaml

# -----------------------------------------------------------------------------
# Adapter surfaces. Parity is the point: a rule that binds under one tool binds
# under all of them. Adding a surface must never require editing a canonical
# body.
#
# `layout` is a path pattern per kind, from the repository root, with `{name}`
# for the artifact's identity. It is a pattern and not a directory because the
# tools do not agree on shape: a skill is a DIRECTORY holding `SKILL.md` for
# every tool that discovers skills, while a rule or a command is one file. Until
# QA-4 round twelve this was `<root>/<dir>/<name><extension>` for every kind,
# which put all 29 skills at `.claude/skills/<id>.md` — a path Claude Code does
# not read — while both surface checks stayed green, because they compared the
# renderer with this file and never with the tools.
#
# Two surfaces may name the same pattern. Cursor and Codex both read the open
# Agent Skills directory `.agents/skills/`, and Codex reads nothing else at
# repository scope; rendering Cursor's copy under `.cursor/skills/` as well
# would list every skill twice there. A shared path is rendered once, naming
# every surface that publishes it.
#
# `front_matter` lists the kinds whose files open with YAML front-matter: a
# skill's `name` and `description`, a Claude command's `description`. The
# tools read them to list and route; without it Claude described every command
# by its first line — the "generated" marker.
# -----------------------------------------------------------------------------
surfaces:
  claude:
    root: .claude
    mode: pointer
    layout:
      rules: .claude/rules/{name}.md
      skills: .claude/skills/{name}/SKILL.md
      workflows: .claude/commands/{name}.md
    front_matter: [skills, workflows]
    context:
      path: .claude_context.md
      tool: Claude Code
      discovery:
        - "`CLAUDE.md` at the root is loaded automatically. It is itself a pointer to `AGENTS.md`, so the authority chain has one root and no tool-specific fork."
        - "A rule under `.claude/rules/` is not auto-attached by path. Open the rules whose scope covers the files you are touching; the scope is stated in the canonical body, not in the pointer."
        - "Each directory under `.claude/skills/` is a registered skill: its `SKILL.md` carries the `name` and `description` Claude routes on, and the operation's mode at the end of the description. The body is a pointer — read `agentic/skills/<id>/SKILL.md` before running the procedure; the full front-matter, allowed tools included, lives there and is deliberately not copied."
        - "A file under `.claude/commands/` backs the `/<name>` slash command, described by its own front-matter; the workflow body it names is canonical under `agentic/workflows/`."

  cursor:
    root: .cursor
    mode: pointer
    layout:
      rules: .cursor/rules/{name}.mdc
      skills: .agents/skills/{name}/SKILL.md
      workflows: .cursor/commands/{name}.md
    front_matter: [skills]
    context:
      path: .cursor_context.md
      tool: Cursor
      discovery:
        - "`.cursor/rules/*.mdc` are rendered by the same generator as every other surface, so they carry **no `globs:` / `alwaysApply:` front-matter**. Cursor therefore attaches none of them automatically — a rule binds because `AGENTS.md` says it does, not because the editor injected it. Read the ones covering your files yourself."
        - "Skills are under `.agents/skills/<id>/SKILL.md`, the open Agent Skills directory Cursor reads alongside `.cursor/skills/`, shared with Codex so that each skill is listed once. Each is a pointer with `name` and `description`; the body it names under `agentic/skills/` is the thing to read."
        - "A file under `.cursor/commands/` backs the `/<name>` command. Commands are plain markdown — Cursor does not read `.mdc` there — and each is a pointer to its canonical workflow under `agentic/workflows/`."
        - "Do not add front-matter to a `.mdc` file to make it auto-attach: it is generated output and the next `sync_agentic_adapters.py` run deletes the edit. Auto-attachment is a renderer change, in `scripts/sync_agentic_adapters.py`."

  codex:
    root: .codex
    mode: pointer
    layout:
      rules: .codex/rules/{name}.md
      skills: .agents/skills/{name}/SKILL.md
      workflows: .codex/automations/{name}.md
    front_matter: [skills]
    context:
      path: .codex_context.md
      tool: Codex
      discovery:
        - "`AGENTS.md` at the repository root is read automatically and is the authority here, so this surface deliberately adds no second contract."
        - "Skills are under `.agents/skills/<id>/SKILL.md` — the only place Codex discovers skills inside a repository — and are shared with Cursor. Each carries the `name` and `description` Codex requires; the body is a pointer to `agentic/skills/<id>/SKILL.md`."
        - "Workflows land under `.codex/automations/`, not `workflows/` — the same canonical bodies as every other surface, under the name this tool uses. Codex does not discover them on its own: they are read because `AGENTS.md` names them. A workflow missing from `agentic/workflows/` is missing here too; the reverse cannot happen, because an orphan is deleted on the next render."
        - "`.codex/mcp.example.json` is the committed example. The live `.codex/mcp.json` is adopter-owned, gitignored, and never rendered by the generator."

  devin:
    # Devin ingests file bodies and cannot follow a pointer, so this surface
    # carries full copies. That is why it is drift-checked: a mirror is the one
    # place where the canonical body can silently go stale.
    root: .devin
    mode: mirror
    layout:
      rules: .devin/rules/{name}.md
      skills: .devin/skills/{name}.md
      workflows: .devin/workflows/{name}.md
    front_matter: []
    context:
      path: .devin_context.md
      tool: Devin
      discovery:
        - "This is the one surface carrying full bodies, because the tool ingests directory contents and cannot follow a path. Everything you read under `.devin/` is a copy; the original is the `agentic/` path named in each file's header."
        - "A mirrored body sits at a different depth than its source, so the generator rewrites every relative link for the new depth. A link copied out of `.devin/` back into a canonical body will therefore be wrong by one level."
        - "Because a copy can go stale silently, this surface is the drift-checked one: `validate_agentic_surface.py` V4 re-applies the generator's own transformation and compares, and V3 fails any mirror that has lost a STOP or CONSULT its canonical body declares."

# -----------------------------------------------------------------------------
# Modes an operation may carry. Ordered by increasing restriction; the
# validator uses this order to reject any surface that de-escalates a mode
# relative to its canonical body.
# -----------------------------------------------------------------------------
modes:
  - AUTO
  - CONSULT
  - STOP
