# Codecov configuration — reporting, not gating.
#
# The coverage GATES are scripts/check_coverage_floors.py (L1, L2, P12, P17):
# measured once per CI run, offline, reproducible with `make verify`, and
# blocking. Codecov adds what those cannot: coverage of each pull request's own
# new lines, and the history. So every status here is informational, and none
# restates a floor — the per-path targets this file used to carry (libs/ 90,
# scripts/ 60) had drifted from the floors that actually block (scripts/ is 86),
# a second copy of a number with nothing holding it to the first.
#
# Uploads authenticate by OIDC (ci.yml); codecov-health.yml checks weekly that
# reports land, because for months none did and nothing noticed (R15-5).
coverage:
  precision: 1
  round: down
  range: "70...95"

  status:
    project:
      default:
        # A fall in the whole repository's coverage, shown on the pull request.
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        # New lines arriving untested is how a suite stops meaning anything;
        # shown on the pull request so the reviewer sees it.
        target: 85%
        threshold: 0%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "templates/project/**"   # un-rendered generator source; verified by rendering it
  - "**/tests/**"
  - ".claude/**"
  - ".cursor/**"
  - ".codex/**"
  - ".devin/**"
