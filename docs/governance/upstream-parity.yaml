# Upstream parity ledger — what ml-service-template has, and what we decided about it.
#
# WHY THIS FILE EXISTS
#
# copier covers `services/`, not this repository. ADR-003 makes the template
# authoritative for service-level concerns and the generated service is
# genuinely generated — but every repository-level artifact was rebuilt by
# hand here, so it exists only where somebody remembered it. Nothing compared
# the two surfaces, so the gap was invisible until it was looked for directly.
#
# The cost, with a receipt: the template ships check_test_clock_isolation.py,
# written after a test broke at 20:52 UTC because a helper read the wall clock.
# This repository then shipped a coherence check that returned a different
# verdict at 13:33 than at 21:19 — same class of defect, guard already
# upstream, never carried across.
#
# STATUS values:
#   pending  — decided to adopt, not done yet. Must exist upstream.
#   adopted  — decided to adopt and DONE. Must exist here, or the gate fails.
#   rejected — decided not to adopt, with the reason. Must NOT exist here,
#              or the rejection is stale and the gate fails.
#
# Adopting a list closes the gap once. This ledger closes it every time: an
# artifact present upstream with no entry here fails the gate whenever the
# template checkout is reachable.
version: 1
upstream: ml-service-template

artifacts:
  - path: .claude_context.md
    status: adopted
    reason: >-
      Adopted as generated output from agentic/manifest.yaml. Carries only what is specific to Claude Code — surface mode, discovery paths, MCP config — and points at AGENT_CONTEXT.md for the shared half so it exists once.
  - path: .codex_context.md
    status: adopted
    reason: >-
      Adopted as generated output, same mechanism.
  - path: .cursor_context.md
    status: adopted
    reason: >-
      Adopted as generated output, same mechanism. Its upstream counterpart is the one that claims 14 rule files against 19.
  - path: .devin_context.md
    status: adopted
    reason: >-
      Adopted as generated output, same mechanism. Its upstream counterpart claims 15 rules, 16 skills and 12 workflows against 19, 27 and 20.
  - path: .git-blame-ignore-revs
    status: pending
    reason: >-
      1d: the ruff migration is a formatting-only commit that pollutes blame.
  - path: .github/workflows/pr-evidence-check.yml
    status: pending
    reason: >-
      1d: enforces that a PR carries its evidence, which is the L1-L4 taxonomy applied at review time.
  - path: .gitleaks.toml
    status: adopted
    reason: >-
      Adopted with ZERO suppressions: a full-history scan reported no findings, so any allowlist would have been suppressing something that does not happen. The file exists so an accepted finding has somewhere to be recorded with its reason.
  - path: .mcp.json.example
    status: pending
    reason: >-
      1d: MCP configuration without committing secrets.
  - path: AGENT_CONTEXT.md
    status: adopted
    reason: >-
      Adopted as GENERATED output, not a written file. Upstream's hand-written equivalents are the argument: .cursor_context.md claims 14 rule files where 19 exist and .devin_context.md claims 15 rules and 16 skills where there are 19 and 27. A hand-written file describing a generated tree has no gate that can catch it drifting.
  - path: CODE_OF_CONDUCT.md
    status: adopted
    reason: >-
      Adopted. Contributor Covenant 2.1 linked rather than reproduced, so the text cannot drift from what it claims to be.
  - path: CONTRIBUTING.md
    status: adopted
    reason: >-
      Adopted, rewritten for this repository: the stage-before-regenerate cadence, the rule that a gate must be verified by breaking what it guards, and the AUTO/CONSULT/STOP classification.
  - path: MIGRATION.md
    status: pending
    reason: >-
      1d: what an adopter does across versions of this platform.
  - path: NOTICE
    status: adopted
    reason: >-
      Adopted. Apache-2.0 attribution, and it names the generated portion of the service layer with a pointer to the ADR that defines the boundary.
  - path: QUICK_START.md
    status: adopted
    reason: >-
      Adopted, rewritten. Its predecessor's hardcoded 'verified with Docker 29.5.2, kind v0.30.0, kubectl v1.34.1' was false on this machine — kubectl is 1.31.14 and there is no Docker — so it points at `bootstrap.sh --check`, which reads the machine the reader is actually on.
  - path: RUNBOOK.md
    status: adopted
    reason: >-
      Adopted, rewritten. Leads with running the gates DIRECTLY rather than through pre-commit or make, because both wrappers currently mislead, and documents the trap that running a gate while the suite runs gives a false stale verdict — tests/test_gate_scripts.py breaks and restores the real tree.
  - path: SECURITY.md
    status: adopted
    reason: >-
      Adopted, adapted. The scope section is the part that differs: a serving-loop vulnerability belongs upstream under ADR-003, and routing it here would delay the fix. Also states that a gate passing without checking anything is a security finding, not a bug.
  - path: VALIDATION_LOG.md
    status: pending
    reason: >-
      1d: the evidence log the L1-L4 taxonomy feeds.
  - path: docs/ADOPTION.md
    status: adopted
    reason: >-
      Adopted, rewritten for this repository. Upstream's version is a maturity matrix for adopting a service template; this one answers what arrives working, what is homework and — at length — what the platform does NOT claim: zero components at L4, Checkov advisory with 114 findings, ADR-008 open, and C7 red by design. A platform that hides its gaps costs the adopter the time they spend discovering them.
  - path: docs/COMPLIANCE_MAPPING.md
    status: adopted
    reason: >-
      Adopted, written independently rather than carried across: a NIST CSF 2.0 self-assessment over 22 Categories,
      which states plainly that no external party reviewed it and reports its gaps as Partial or Not satisfied rather
      than claiming coverage. It sat in the tree marked `pending` because the ledger only checked for adopted files
      that were missing, never for pending files that were present.
  - path: docs/PROGRESSION.md
    status: adopted
    reason: >-
      Adopted, written for this repository rather than carried across: six stages, each finished by a COMMAND rather
      than by having been read. It occupies the gap between ADOPTION.md (what is this) and QUICK_START.md (the first
      hour) — the order to take the pieces in, and how to tell a stage is done. Stage 5 is cloud, and says plainly
      that the adopter is ahead of the platform there rather than following it.
  - path: docs/RELEASING.md
    status: adopted
    reason: >-
      Adopted, adapted to a repository that has never released: it ties VERSION and the CHANGELOG together and states
      what may not be cut, rather than describing a cadence nothing has exercised yet. Also stood marked `pending`
      while present, for the same missing check.
  - path: docs/TUTORIAL.md
    status: rejected
    reason: >-
      Rejected: QUICK_START.md is already the adopter's first hour here, and runs further than the upstream
      counterpart — 303 lines from a green suite to a Ready pod answering in kind, with a section on what that
      proves and one on when it does not work. Upstream keeps both because its QUICK_START is a ten-minute setup.
      Two entry documents means the reader picks one, and the one they pick is eventually the stale one. The
      ordering material a tutorial would otherwise carry is in docs/PROGRESSION.md, which is not a second walkthrough.
  - path: docs/environment-promotion.md
    status: adopted
    reason: >-
      Adopted, and inverted: it specifies a contract instead of describing a behaviour, because this repository has
      seven overlays and NO deploy workflow, so no promotion mechanism exists to document. It leads with that, maps
      L1-L4 onto the four environments, and names the five things that must be built before any of it runs. An
      environment table with six green rows and no deploy job is how a reader concludes a platform does something
      it does not.
  - path: llms.txt
    status: adopted
    reason: >-
      Adopted, and gated: tests/test_llms_txt.py compares every count in it against the filesystem, including the layer and component totals which it quotes from the derived status document rather than recounting. It is also the deterministic baseline Phase 1e has to beat, and a stale baseline would make that comparison flattering.
  - path: scripts/check_baselines_expiry.py
    status: adopted
    reason: >-
      Adopted, and deliberately NOT in the shape that would have passed today. Every file in
      .security-baselines/ is empty, so upstream's version — which returns 0 when the directory has no
      entries — would have been green for the same reason it would be green on the day the first
      suppression lands unannotated. That is P-09 exactly. Instead it enforces the four-part contract
      README.md already states in prose and nothing checked: finding ID (never a wildcard), reason, owner
      as a GitHub handle, and an expiry no more than a quarter out. It also prints the entry count rather
      than implying zero, and reports "armed, not satisfied" when there is nothing to expire. Verified by
      breaking it seven ways in tests/test_baselines_expiry.py — expired, no expiry, no owner, a team as
      owner, an expiry five years out, a wildcard ID, and an entry borrowing its neighbour's annotation —
      one of them planted in the real checkov.yml so a mis-wired default path cannot hide behind sandboxes.
  - path: scripts/check_dashboard_inventory.py
    status: adopted
    reason: >-
      Adopted, retargeted from "is every dashboard in INDEX.md" to the invariants that only exist BETWEEN
      files, because that is what this repository was missing. tests/test_dashboards_structure.py is
      parametrised one dashboard at a time: it can assert each HAS a uid and can never assert two have
      DIFFERENT uids. Grafana keys on uid, so a collision means one file silently replaces the other in
      ConfigMap enumeration order — no error, no log, and a bookmarked dashboard showing another service's
      panels. make local-dashboards provisions the directory wholesale with --from-file, which is what
      makes the directory rather than the file the unit worth checking: anything dropped there is a deploy.
      The register is platform/observability/README.md, which gained a table naming each dashboard, its uid,
      what it answers and who reads it. The five dashboards under services/ are REPORTED and never failed
      on: that tree is generated from ml-service-template and byte-identical to it (ADR-003), so a defect
      there is upstream's, and reporting keeps their absence from the local stack a recorded fact.
  - path: scripts/check_gitleaks_pin.py
    status: pending
    reason: >-
      1d: an unpinned scanner action is a supply-chain surface.
  - path: scripts/check_test_clock_isolation.py
    status: adopted
    reason: >-
      Adopted, adapted, and extended. Upstream checks that tests do not call a wall-clock API; this version adds a second check that PRODUCTION code never hands git a --since/--until date filter, which is the exact defect C7 shipped here. Exemptions carry an exact count and expire when the call disappears. Verified by four injections, including reverting _commits_since to the broken form.
  - path: scripts/ci_classify_failure.py
    status: pending
    reason: >-
      1d: CI triage; portable and independent of the template's mechanics.
  - path: scripts/ci_collect_context.py
    status: pending
    reason: >-
      1d: gathers the context a CI failure needs to be diagnosed without re-running it. Portable, and independent of the template's scaffolding mechanics.
  - path: scripts/mcp_doctor.py
    status: rejected
    reason: >-
      Rejected as a script, with its one portable check folded into the gate that already exists. Read
      against scripts/check_mcp_registry.py, mcp_doctor's `check` mode has four checks and three of them
      resolve against templates/config/surface_capabilities.yaml, which this repository does not have and
      has no reason to grow. Its other two modes are a human report and a generator for
      docs/agentic/mcp-portability.md, a document nothing here reads — landing it would create a second
      generated surface competing with sync_agentic_adapters.py, and a second MCP gate that can disagree
      with the first about the same registry. check_mcp_registry.py is also strictly stronger on the half
      that matters: install-mode allow-listing, credentials in committed examples, and resistance to being
      disabled from the file it judges. The fourth check DID port and was missing here — every
      required_for / recommended_for id must name a skill or workflow that exists on disk. The old rule
      required only a non-empty list, so a renamed skill left the server it justified still looking
      justified and the capability outlived its reason. Verified by
      test_a_server_justified_by_a_skill_that_does_not_exist_fails.
  - path: scripts/validate_quality_gates.py
    status: adopted
    reason: >-
      Adopted, rewritten against this repository's two gate notations instead of upstream's one. Upstream
      validates configs/quality_gates.yaml against a JSON Schema; gates here are declared in
      docs/governance/quality-gates.md as a markdown table and in projects/*/evals/gates.yaml as data
      shaped by PROJECT_CONTRACT P6, and a schema reaches neither. It found two live defects on its first
      run: `P6` was the id of TWO rows, while codecov.yml cites L1, ci.yml cites L1/L2 and
      COMPLIANCE_MAPPING.md cites S4 and C3 — a citation resolving to two thresholds resolves to neither;
      and row C3 gave `**PENDING — Phase 3**` where a reason belongs, a schedule standing in for the
      argument that keeps a threshold from being lowered. Check C4's docstring had claimed to check "a
      command and a threshold rationale" while never reading the rationale column, and exempted every
      PENDING row from everything. Command resolution is left to C4 so the two cannot disagree. The YAML
      half is the complement of tests/test_project_contract.py rather than a copy: that test SKIPS any
      project in KNOWN_DEVIATIONS, so a malformed gates.yaml inside rag-assistant would be validated by
      nothing — an exemption from declaring gates as data is not an exemption from the data being well
      formed. templates/project/evals/gates.yaml is excluded as Jinja source, verified by rendering.
  - path: .github/workflows/ci-examples.yml
    status: rejected
    reason: >-
      The template ships runnable examples/; this repo ships projects/, covered by the main CI lane.
  - path: .github/workflows/ci-self-healing-shadow.yml
    status: rejected
    reason: >-
      A shadow lane for the template's self-healing experiment. Out of scope here (ADR-000).
  - path: .github/workflows/golden-path-extended.yml
    status: rejected
    reason: >-
      Exercises the template's scaffold-to-deploy path with the closed loop attached. The equivalent here is `make local-serve` plus tests/local, which is L3 evidence produced on a machine with Docker rather than a CI lane.
  - path: .github/workflows/golden-path.yml
    status: rejected
    reason: >-
      Exercises the template's scaffold-to-deploy path. The equivalent here is `make local-serve` plus tests/local, which is L3 evidence rather than a CI lane.
  - path: .github/workflows/kyverno-smoke.yml
    status: rejected
    reason: >-
      Kyverno policies here are rendered and tested offline by tests/test_gitops_manifests.py; a cluster smoke belongs to Phase 2 with a real cluster.
  - path: .github/workflows/policy-tests.yml
    status: rejected
    reason: >-
      Kyverno policies here are rendered and asserted offline by tests/test_gitops_manifests.py, which runs on every commit. A second lane needing a cluster belongs to Phase 2.
  - path: .github/workflows/pr-smoke-lane.yml
    status: rejected
    reason: >-
      Smoke-tests a rendered service. tests/test_project_generator.py renders and asserts the contract instead.
  - path: .github/workflows/template-context-tests.yml
    status: rejected
    reason: >-
      Tests the template's own context files against its scaffolding. Revisit once the per-tool context files land here.
  - path: .github/workflows/validate-templates.yml
    status: rejected
    reason: >-
      Validates the template's Jinja sources. The equivalent here is tests/test_project_generator.py, which renders templates/project for real.
  - path: DCO.md
    status: rejected
    reason: >-
      No external contributors yet, and a sign-off requirement nobody enforces is theatre. Revisit when the first outside PR arrives.
  - path: docker-compose.yml
    status: rejected
    reason: >-
      The local stack here is kind-based (platform/local), which is closer to the deployment target. Two local paths would mean one of them is untested.
  - path: docs/FASTAPI_TEMPLATE_CONTRACT.md
    status: rejected
    reason: >-
      Equivalent exists: docs/PROJECT_CONTRACT.md states what a VERTICAL must expose. The upstream file states what a generated SERVICE must expose, which is the template's concern under ADR-003.
  - path: docs/ide-parity-audit.md
    status: rejected
    reason: >-
      Four-tool parity here is enforced by scripts/sync_agentic_adapters.py --check rather than audited in prose.
  - path: docs/threadpool-sizing.md
    status: rejected
    reason: >-
      Serving executor sizing is a service-level concern, authoritative upstream under ADR-003 section 2. Duplicating the analysis here invites the two to disagree.
  - path: scripts/check_adopter_scaffold_ref.py
    status: rejected
    reason: >-
      Guards the template's adopter-reference mechanics; this repo has no adopters of that kind.
  - path: scripts/check_cicd_template_drift.py
    status: rejected
    reason: >-
      Guards drift between the template's own CI and its rendered output. The equivalent here is tests/test_project_generator.py.
  - path: scripts/check_common_utils_drift.py
    status: rejected
    reason: >-
      Guards the template's vendored common_utils. This repo depends on libs/ by workspace path, so drift is impossible by construction.
  - path: scripts/check_service_adr_references.py
    status: rejected
    reason: >-
      Rejected, with the argument corrected after an audit showed the first one false. It said 'C2 already resolves foreign references against the template's index when reachable' — and in CI that checkout is NEVER present, so C2 reports 151 references NOT checked there. The rejection rested on a mechanism inert exactly where it matters. The true argument is narrower and holds: those 151 references live in services/, which is byte-identical to what ml-service-template generates, so a dangling one among them is a defect in that repository and is caught by its own CI, not ours.
  - path: scripts/check_vendored_runtime_drift.py
    status: rejected
    reason: >-
      Guards drift in the template's vendored runtime copies. Nothing is vendored here: libs/ is consumed by workspace path, so a divergent copy cannot exist by construction.
  - path: scripts/ci_verify_targeted.py
    status: rejected
    reason: >-
      Guards the template's path-filtered CI lanes; this repo's filters are derived from the import graph and tested by tests/test_dependency_direction.py.
  - path: scripts/ci_verify_workflows.py
    status: rejected
    reason: >-
      Equivalent exists: scripts/check_ci_references.py asserts every `run:` script resolves.
  - path: scripts/ci_verify_yaml.py
    status: pending
    reason: >-
      Moved from rejected to pending, because the rejection cited pre-commit's check-yaml and an audit established that hook runs ONLY locally — no workflow invokes it. YAML that CI genuinely parses is limited to what a test opens: the workflows, the kustomize overlays, the parity ledger. Everything else is unvalidated on a runner. Closing this means a CI step that parses every tracked YAML, or a test that does.
  - path: scripts/generate_report.py
    status: rejected
    reason: >-
      Produces the template's own audit report format. This repo derives its reports from the filesystem instead.
  - path: scripts/validate_agentic.py
    status: rejected
    reason: >-
      Equivalent exists: scripts/validate_agentic_surface.py --strict.
  - path: scripts/validate_agentic_manifest.py
    status: rejected
    reason: >-
      Same equivalent; this repo has no separate manifest file.
  - path: scripts/verify_enterprise_adoption.py
    status: rejected
    reason: >-
      Verifies adoption of the TEMPLATE by a service. The equivalent question here is the project contract.
  - path: .devcontainer/devcontainer.json
    status: adopted
    reason: >-
      Adopted, complete this time. Strict JSON rather than JSONC, because pre-commit's check-json covers the path — proven by writing a JSONC probe and watching the hook fail. The reasoning lives in .devcontainer/README.md since strict JSON has nowhere to put it.
  - path: .devcontainer/post-create.sh
    status: adopted
    reason: >-
      Adopted. Supplies what the devcontainer features do not — shellcheck and a checksum-verified kind — then hands off to bootstrap.sh and dev-setup.sh, so 'works in the devcontainer' and 'works on my machine' are the same claim rather than two.
  - path: .github/CODEOWNERS
    status: adopted
    reason: >-
      Adopted. Every rule names one owner because that is the truth; the value is the boundaries it records — services/ upstream-owned, agentic/ canonical against generated adapters, docs/architecture/ derived, and the gates as their own surface.
  - path: .github/markdown-link-check.json
    status: adopted
    reason: >-
      Adopted. 644 markdown files and nothing verified their links; running it found 40 broken, including a generator defect that produced unresolvable links in generated output.
  - path: .github/pull_request_template.md
    status: adopted
    reason: >-
      Adopted. Four questions only: what and why, the AUTO/CONSULT/STOP class, the evidence with its L1-L4 layer and where it ran, and — when the change adds a gate — what was broken to prove it can fail.
  - path: .security-baselines/.trivyignore
    status: adopted
    reason: >-
      Adopted empty, and it records the caveat that the CI step's scan-type: fs covers vulnerabilities and secrets, not IaC misconfiguration — which the step's own comment claimed.
  - path: .security-baselines/README.md
    status: adopted
    reason: >-
      Adopted, with ZERO entries in any of the four files. Trivy over the CI scope reported no findings; Checkov reported 114 under platform/ and they are recorded in SECURITY.md rather than suppressed. The README carries the policy: finding id, reason, named owner and an expiry no more than a quarter out, and an expired entry is a finding in itself.
  - path: .security-baselines/checkov.yml
    status: adopted
    reason: >-
      Adopted empty. Holds only skip-check, unlike upstream which also duplicates framework and severity — those live in the workflow, and a second copy would drift from it.
  - path: .security-baselines/tfsec.yml
    status: adopted
    reason: >-
      Adopted empty. Upstream's three exclusions were checked against this repository and NONE survived: one no longer fires, and the other two would have silenced real gaps here to quiet a false positive that exists only upstream.
  - path: scripts/bootstrap.sh
    status: adopted
    reason: >-
      Adopted, and narrower than upstream's. It INSTALLS only uv and a uv-managed interpreter, both under $HOME and both verified by running them; everything else it inspects and reports with the exact command for the detected package manager. A script that sudo-installs on an unknown distro is guessing with root.
  - path: scripts/dev-setup.sh
    status: adopted
    reason: >-
      Adopted, and it installs BOTH hook types. A plain `pre-commit install` leaves conventional-pre-commit unarmed here, because that hook declares stages: [commit-msg] and the config sets no default_install_hook_types — verified, not assumed.
  - path: .vscode/settings.json
    status: rejected
    reason: >-
      Editor settings are a personal choice, and this repo already enforces what matters through ruff, mypy and pre-commit, which run regardless of editor.
  - path: scripts/_lib/configure_mcp.sh
    status: rejected
    reason: >-
      Helper for the template's bootstrap. Adopt with bootstrap.sh if that lands and needs it, not before — an unused helper is one nobody maintains.
  - path: scripts/_lib/detect_os.sh
    status: rejected
    reason: >-
      Helper for the template's bootstrap. This repo installs through uv, which resolves platform wheels itself, so OS detection has no caller here.
  - path: scripts/_lib/install_deps.sh
    status: rejected
    reason: >-
      Same. This repo installs through uv, which does not need OS detection.
  - path: scripts/test_kyverno_admission.sh
    status: rejected
    reason: >-
      Requires a cluster with Kyverno installed. That is L3/L4 evidence and belongs with Phase 2, not as a shell script nobody runs.
  - path: scripts/test_scaffold.sh
    status: rejected
    reason: >-
      Smoke-tests a rendered SERVICE. The equivalent here renders templates/project and asserts the project contract: tests/test_project_generator.py.
