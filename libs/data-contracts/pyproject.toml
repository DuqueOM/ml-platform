[project]
name = "data-contracts"
version = "0.1.0"
description = "See libs/data-contracts/src/data_contracts/__init__.py"
requires-python = ">=3.11"
dependencies = [
    "pandera~=0.36",
    "polars~=2.0",
]

[project.optional-dependencies]
# `data_contracts.duckdb_relation` validates a DuckDB relation without loading
# it (ADR-011). Optional: a consumer validating Polars frames pulls no engine.
duckdb = ["duckdb~=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_contracts"]
