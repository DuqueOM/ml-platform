[project]
name = "feature-defs"
version = "0.1.0"
description = "Point-in-time correct feature retrieval, and the definitions it operates on"
requires-python = ">=3.11"
dependencies = [
    "polars~=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_defs"]
