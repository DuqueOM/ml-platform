[project]
name = "llm-core"
version = "0.1.0"
description = "See libs/llm-core/src/llm_core/__init__.py"
requires-python = ">=3.11"
# scikit-learn and numpy are needed by `semantic_index` only. The instrument
# — `retrieval_eval` — stays import-free of both on purpose: a measuring
# device that depends on the thing it measures cannot be trusted to report a
# loss, and the baseline it compares against must run where the candidate
# cannot.
dependencies = [
    "numpy~=2.4",
    "scikit-learn~=1.9",
    # The migrated agent core (ADR-002) validates every tool call and every
    # tier response against a model before anything acts on it. Structured
    # tool calling is the whole reason the loop is safe to run: a model that
    # names a tool cannot also decide what its arguments mean.
    "pydantic~=2.9",
    "PyYAML~=6.0",
    "httpx~=0.28",
    # BM25 lexical retrieval, the agent core's in-context document tool.
    "rank-bm25~=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_core"]
