apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-forecast
spec:
  replicas: 2
  selector:
    matchLabels: { app: demand-forecast }
  template:
    metadata:
      labels: { app: demand-forecast }
    spec:
      # Pod Security "restricted" is the namespace default, so every field it
      # requires is set here rather than left to be discovered at admission —
      # a rejected pod at deploy time reads as an outage, not as a policy.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: serving
          image: ghcr.io/duqueom/ml-platform/demand-forecast:latest
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          # The paths are the ones the SERVICE serves, which is not what this
          # file said. It probed `/health/ready` and `/health/live`; the app
          # exposes `/health` and `/ready`. Both probes 404ed, so a pod could
          # never become Ready and liveness would restart it forever — across
          # six overlays that all rendered green, because rendering a manifest
          # never asks the container whether the route exists. Found by trying
          # to start it, which is the whole reason Phase 1c exists.
          #
          # ADR-003 §2: the template is authoritative for serving, and its own
          # manifest probes these paths. `tests/test_probe_paths.py` now
          # compares them against the routes the app declares.
          startupProbe:
            # Absorbs the slow start — model load plus warm-up — so liveness
            # never fires at a pod that is merely still warming up. This is
            # what the previous "deliberately later and slower" liveness was
            # approximating, and a startupProbe does it without leaving a real
            # hang undetected for 30 seconds afterwards.
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
