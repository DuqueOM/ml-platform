apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-forecast
spec:
  replicas: 2
  selector:
    matchLabels: { app: demand-forecast }
  template:
    metadata:
      labels: { app: demand-forecast }
      # Without these the pod serves /metrics and nothing collects it. Measured
      # before adding them: Prometheus had two targets, neither this service,
      # and zero `demand_forecast_*` series — so an alert rule would never fire
      # and a dashboard panel would be empty, which reads as "no traffic"
      # rather than as a missing annotation.
      #
      # The template's own manifest carries exactly these three (ADR-003 §2);
      # this file had none.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Pod Security "restricted" is the namespace default, so every field it
      # requires is set here rather than left to be discovered at admission —
      # a rejected pod at deploy time reads as an outage, not as a policy.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: serving
          # NOT a deployable reference, and deliberately unresolvable. The
          # tag was `:latest`, which only the `local` overlay overrode — so
          # the six cloud overlays inherited a MUTABLE tag, in a repository
          # that argues for digest pinning everywhere else.
          #
          # A deploy pipeline replaces this with an immutable digest
          # (`@sha256:...`). Until one exists, an accidental apply fails with
          # ImagePullBackOff on a name that says why, which is strictly better
          # than silently pulling whatever `latest` happens to be.
          image: ghcr.io/duqueom/ml-platform/demand-forecast:set-by-deploy-pipeline
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          # The paths are the ones the SERVICE serves, which is not what this
          # file said. It probed `/health/ready` and `/health/live`; the app
          # exposes `/health` and `/ready`. Both probes 404ed, so a pod could
          # never become Ready and liveness would restart it forever — across
          # six overlays that all rendered green, because rendering a manifest
          # never asks the container whether the route exists. Found by trying
          # to start it, which is the whole reason Phase 1c exists.
          #
          # ADR-003 §2: the template is authoritative for serving, and its own
          # manifest probes these paths. `tests/test_probe_paths.py` now
          # compares them against the routes the app declares.
          startupProbe:
            # Absorbs the slow start — model load plus warm-up — so liveness
            # never fires at a pod that is merely still warming up. This is
            # what the previous "deliberately later and slower" liveness was
            # approximating, and a startupProbe does it without leaving a real
            # hang undetected for 30 seconds afterwards.
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
