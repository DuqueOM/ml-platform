# The cloud-agnostic base. Everything an overlay changes is a patch, so a
# reader can see the whole difference between prod-gcp and dev-aws by reading
# two short files rather than diffing two full manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# `labels`, not `commonLabels`. commonLabels also rewrites every SELECTOR it
# can reach — including NetworkPolicy peer selectors that point at pods this
# kustomization does not own. It turned allow-dns's `{k8s-app: kube-dns}` into a
# selector no CoreDNS pod carries, denying DNS under default-deny in every cloud
# overlay (QA-4 rounds ten and eleven). Selectors stay as written; the labels
# still reach resource metadata and the pod template.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: demand-forecast
      app.kubernetes.io/managed-by: argocd
