# The CONSUMER side of secret delivery, identical on both clouds.
#
# What a pod needs is a Secret with known keys. Where those values come from is
# a property of the cloud, so it lives in the SecretStore each overlay supplies
# — the same split as the Terraform adapters, applied one layer up.
#
# No secret VALUE is committed anywhere in this repository. That is not a
# convention here, it is the point of the operator: the manifest names a remote
# key and the cluster resolves it, so a leaked manifest leaks a key NAME.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demand-forecast
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Resolved by the overlay. The base must not name a provider, or it stops
    # being the shared half.
    name: cloud-secret-store
    kind: SecretStore
  target:
    name: demand-forecast
    creationPolicy: Owner
  data:
    - secretKey: warehouse-password
      remoteRef:
        key: demand-forecast/warehouse-password
    - secretKey: mlflow-token
      remoteRef:
        key: demand-forecast/mlflow-token
