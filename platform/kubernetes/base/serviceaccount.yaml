# The identity the pod runs as, and the reason it cannot be the default one.
#
# Without `serviceAccountName` the pod runs as the namespace's `default`
# ServiceAccount. Workload Identity (GCP) and IRSA (AWS) both bind a CLOUD
# identity to a NAMED Kubernetes ServiceAccount, so a pod on `default` has no
# cloud identity at all — and the repository's own invariant is "ALWAYS IRSA /
# Workload Identity, no hardcoded credentials". The overlays provisioned the
# binding and the pod could not use it.
#
# The cloud-specific annotation is added by each overlay, because which cloud
# is a property of the overlay and this file is the shared half.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demand-forecast
# No token is mounted: nothing here talks to the Kubernetes API, and a mounted
# token is a credential an application does not need but an attacker does.
automountServiceAccountToken: false
