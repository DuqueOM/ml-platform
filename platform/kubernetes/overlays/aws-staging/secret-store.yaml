# AWS: Secrets Manager, reached through IRSA.
#
# The counterpart to Workload Identity, arriving at the same place — a pod
# identity with no long-lived key — through an entirely different mechanism.
# That asymmetry is why this file is per-overlay and the ExternalSecret is not.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: demand-forecast
