# GCP: Secret Manager, reached through Workload Identity.
#
# No serviceAccountRef key file. The pod's Kubernetes service account is bound
# to a Google service account, so the credential is an identity rather than a
# file that can be copied out of the cluster.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloud-secret-store
spec:
  provider:
    gcpsm:
      projectID: ml-platform-staging
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: demand-forecast-staging
          serviceAccountRef:
            name: demand-forecast
