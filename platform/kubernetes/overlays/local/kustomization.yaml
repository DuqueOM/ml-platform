# The overlay that has to actually run. The six cloud overlays render; this
# one is applied to a kind cluster and its pod either reaches Ready or does
# not, which is a different and much harder claim.
#
# One thing the cloud overlays carry is deliberately absent:
#
#   - `../../base/secrets` and `secret-store.yaml` need the External Secrets
#     CRDs and a cloud identity. Installing them here would test a mock of the
#     thing rather than the thing. `secret.yaml` supplies the Secret they would
#     have produced, with values that are not secrets and say so — without it
#     the container cannot start at all, which went unnoticed for weeks because
#     a running pod does not re-resolve its Secret.
#   The NetworkPolicies under `../../../policies` ARE included, and that took
#   two corrections. This comment first called them Kyverno policies; then it
#   said kind cannot enforce NetworkPolicy at all. Both were wrong. Measured on
#   this cluster with kindnetd v20250512: under `default-deny` a probe pod's
#   DNS is denied, `allow-dns` restores it, rewriting the peer selector denies
#   it again, and Prometheus scrapes the serving pod through
#   `allow-serving-ingress` once the monitoring role label is on its namespace.
#   `tests/local/test_network_policies.py` is that measurement, kept.
#
# The secrets half is still named rather than silently omitted, so the
# difference between "runs locally" and "runs in a cloud" stays legible.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demand-forecast-local

resources:
  - namespace.yaml
  - prometheus-rbac.yaml
  - secret.yaml
  - ../../base
  - ../../../policies

patches:
  - path: local-runtime.yaml
    target: { kind: Deployment, name: demand-forecast }
  # minAvailable 1 against a single replica blocks a drain forever, which on a
  # laptop reads as `kubectl delete` hanging with no explanation.
  - path: pdb.yaml
    target: { kind: PodDisruptionBudget, name: demand-forecast }

images:
  - name: ghcr.io/duqueom/ml-platform/demand-forecast
    newName: ml-platform/demand-forecast
    newTag: local

# `labels`, not `commonLabels`. commonLabels also rewrites every SELECTOR it
# can reach — including NetworkPolicy peer selectors that point at pods this
# kustomization does not own. It turned allow-dns's `{k8s-app: kube-dns}` into a
# selector no CoreDNS pod carries, denying DNS under default-deny in every cloud
# overlay (QA-4 rounds ten and eleven). Selectors stay as written; the labels
# still reach resource metadata and the pod template.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: local
      cloud: none
