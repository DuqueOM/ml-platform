# The Secret the base Deployment consumes, supplied locally because nothing
# else can supply it here.
#
# In cloud, `../../base/secrets` ships an ExternalSecret and the operator
# resolves it from the provider's secret manager; this overlay deliberately
# excludes that, because installing the CRDs and a cloud identity locally would
# test a mock of the thing rather than the thing.
#
# What was missing was the consequence: the base names `demand-forecast` for
# WAREHOUSE_PASSWORD and MLFLOW_TOKEN, so without this the container never
# starts — `CreateContainerConfigError: secret "demand-forecast" not found`.
# That went unnoticed because the running pod predated the requirement and a
# running pod does not re-resolve its Secret. It surfaced the moment the
# Deployment was recreated (QA-4 R11-2).
#
# The values are not secrets and say so. They are the same pattern the local
# stack already uses for Postgres and MinIO: the local path needs a value, the
# cloud path must never read one from a committed file
# (rule 06-security-governance). Nothing here reaches a warehouse or an MLflow
# server — the local pod runs with ALLOW_MODELLESS_STARTUP.
apiVersion: v1
kind: Secret
metadata:
  name: demand-forecast
type: Opaque
stringData:
  warehouse-password: "local-only-not-a-secret"
  mlflow-token: "local-only-not-a-secret"
