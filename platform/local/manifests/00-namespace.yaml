apiVersion: v1
kind: Namespace
metadata:
  name: ml-platform
  labels:
    # Pod Security Standards, matching what the cloud overlays enforce. Applied
    # locally so a manifest that would be rejected in production is rejected
    # here first, where the feedback costs nothing.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Roles this namespace fulfils, per platform/policies/namespace-contract.yaml.
    # One namespace, several roles: the local stack runs Prometheus, Grafana,
    # Jaeger and the OTel collector here, so it IS the monitoring namespace.
    # It is not the ingress role — there is no controller locally — and the
    # contract records that rather than leaving the policy to drop traffic
    # while looking satisfied.
    role.ml-platform.io/monitoring: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stack-budget
  namespace: ml-platform
spec:
  hard:
    # Total of platform/local/budget.yaml minus the node's own allocation.
    # A component added without updating the budget is rejected by the quota
    # rather than discovered by the OOM killer.
    limits.memory: 1824Mi
