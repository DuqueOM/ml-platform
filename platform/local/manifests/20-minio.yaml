# MinIO: S3-compatible object storage backing the local Iceberg warehouse.
# The same S3 API the cloud path uses, so table format and catalogue behaviour
# are exercised identically — only the endpoint changes.
apiVersion: v1
kind: Secret
metadata: { name: minio-credentials, namespace: ml-platform }
stringData:
  MINIO_ROOT_USER: "mlplatform"
  MINIO_ROOT_PASSWORD: "local-only-not-a-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: ml-platform }
spec:
  replicas: 1
  strategy:
    # Single replica over emptyDir: a RollingUpdate provides no
    # availability benefit and needs double the memory, which the
    # namespace quota (= the declared budget) deliberately refuses.
    type: Recreate
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          envFrom: [{ secretRef: { name: minio-credentials } }]
          resources:
            requests: { memory: "192Mi", cpu: "100m" }
            limits:   { memory: "320Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: ml-platform }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
