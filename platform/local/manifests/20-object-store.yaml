# The object store: S3-compatible storage backing the local Iceberg warehouse
# and DVC's remote. The same S3 API the cloud path uses, so table format and
# catalogue behaviour are exercised identically — only the endpoint changes.
#
# RustFS, not MinIO (R15-20). Every minio/minio tag stopped resolving
# anonymously on Docker Hub, and Quay requires authentication, so a clean
# machine could not run `make local-up` at all. RustFS (Apache-2.0) publishes
# its images openly, speaks the S3 API this stack uses, and passed the
# lakehouse's integration tests unchanged when it was chosen; SeaweedFS needed
# an identity file to accept a key, and VersityGW's POSIX gateway answered
# HeadObject with a 400.
apiVersion: v1
kind: Secret
metadata: { name: object-store-credentials, namespace: ml-platform }
stringData:
  RUSTFS_ACCESS_KEY: "mlplatform"
  RUSTFS_SECRET_KEY: "local-only-not-a-secret"
---
# Persistent, unlike every other component here: the buckets and the tables in
# them are what the lakehouse catalogue points at. Over emptyDir a pod restart
# — a memory-limit change was enough — emptied the store while the catalogue
# kept naming its files, and the integration tests that need the bucket failed
# until someone recreated it by hand. kind's default class keeps it on the node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: object-store-data, namespace: ml-platform }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: object-store, namespace: ml-platform }
spec:
  replicas: 1
  strategy:
    # Single replica over a ReadWriteOnce volume: a RollingUpdate could not
    # mount it twice, and needs double the memory, which the namespace quota
    # (= the declared budget) deliberately refuses.
    type: Recreate
  selector: { matchLabels: { app: object-store } }
  template:
    metadata: { labels: { app: object-store } }
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's own user.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: object-store
          image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          args: ["/data"]
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          envFrom: [{ secretRef: { name: object-store-credentials } }]
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            # Measured at peaks of 153–222 MiB with the lakehouse's integration
            # tests writing to it (78 MiB idle) — scripts/local/measure_memory.py;
            # 320 leaves the 25% the budget requires. platform/local/budget.yaml
            # records it and tests/test_local_memory_budget.py holds the two together.
            limits:   { memory: "320Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: object-store-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: object-store, namespace: ml-platform }
spec:
  type: NodePort
  selector: { app: object-store }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
