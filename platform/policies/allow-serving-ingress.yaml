# Ingress to the serving port, from the ingress controller only.
#
# Scoped to a namespace label rather than left open: an inference endpoint
# reachable from every pod in the cluster is one lateral step from any other
# compromised workload, and the edge protection in ADR-006 guards the front
# door rather than the corridor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-serving-ingress
spec:
  podSelector:
    matchLabels: { app: demand-forecast }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 8000 }
