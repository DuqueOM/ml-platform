# Ingress to the serving port, from the ingress controller only.
#
# Scoped to a namespace label rather than left open: an inference endpoint
# reachable from every pod in the cluster is one lateral step from any other
# compromised workload, and the edge protection in ADR-006 guards the front
# door rather than the corridor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-serving-ingress
spec:
  podSelector:
    matchLabels: { app: demand-forecast }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 8000 }
    # Prometheus, on the same port, and this rule was missing.
    #
    # The Deployment annotates `prometheus.io/scrape: "true"` on port 8000 and
    # `default-deny` denies every ingress not named here — so the pod
    # ADVERTISED a scrape the cluster refused. The SLO rules, the dashboards
    # and the alerting all rest on a series that would never have arrived, and
    # nothing in the rendered manifests disagrees with itself: an annotation is
    # a request, a NetworkPolicy is the answer, and only one of them was read.
    - from:
        - namespaceSelector:
            matchLabels: { app.kubernetes.io/name: monitoring }
      ports:
        - { protocol: TCP, port: 8000 }
