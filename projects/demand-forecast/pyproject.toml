[project]
name = "demand-forecast"
version = "0.1.0"
description = "Demand Forecast"
requires-python = ">=3.11"
# Dependencies point DOWN into libs/ only. A project never depends on another
# project — shared code moves down, never sideways (ADR-001 rule 2), and
# tests/test_dependency_direction.py enforces it.
dependencies = [
    # pyiceberg-core: the Rust transforms. Required for PARTITIONED writes; a
    # missing extra surfaces as NotInstalledError at the first partitioned
    # write, not at install.
    "pyiceberg[s3fs,sql-sqlite,pyiceberg-core]~=0.10",
    # Explicit: pyiceberg accepts Arrow tables but does not pull pyarrow, and
    # the failure is an ImportError at first write rather than at install.
    "pyarrow~=21.0",
    # HistGradientBoosting rather than LightGBM: comparable on tabular data at
    # this size, and it is already a transitive dependency, so the forecast
    # costs no new supply-chain surface.
    "scikit-learn~=1.5",
    # Imported directly by `persist`, so declared directly. It arrives as a
    # scikit-learn transitive today, and a transitive dependency is one
    # upstream release away from not arriving at all.
    "joblib~=1.4",
    "ml-core",
    "data-contracts",
    "serving-core",
    "feature-defs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecast"]

[project.optional-dependencies]
# Great Expectations sits at the WAREHOUSE boundary, complementary to the
# Pandera-style contracts at the function boundary (ADR-004). Optional because
# its tier is `demonstrated`: it is worth operating once and showing, not worth
# imposing on everyone who installs this project. It also pulls a large
# dependency tree, which the local memory budget notices.
warehouse-validation = [
    "great-expectations~=1.3",
]
pipelines = [
    "kfp~=2.11",
]
observability = [
    "opentelemetry-exporter-otlp-proto-grpc~=1.30",
    "opentelemetry-sdk~=1.30",
]
