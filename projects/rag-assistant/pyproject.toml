[project]
name = "rag-assistant"
version = "0.1.0"
description = "Retrieval-augmented assistant over SEC EDGAR filings, with retrieval gated on beating a lexical baseline."
requires-python = ">=3.11"
dependencies = [
    "llm-core",
    # Declared because `contracts.py` imports it: `parse_index` used to
    # validate EDGAR's index inline and skip bad rows without recording why.
    "data-contracts",
    "polars~=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]
