[project]
name = "ml-platform"
version = "0.1.0"
description = "Multi-project ML platform monorepo: shared substrate across tabular, deep learning, LLM and agent projects, multi-cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Airflow is Core tier (ADR-004) but an extra rather than a base dependency:
# it pulls 81 packages, and nothing outside `orchestration/` imports it. CI
# runs `uv sync --all-extras`, so the DAG-import test executes there — an
# orchestrator whose DAGs are never parsed in CI is a directory of files that
# look like DAGs.
orchestration = [
    "apache-airflow~=3.3",
]
dev = [
    "pytest~=8.3",
    "pytest-cov~=6.0",
    "mypy~=1.13",
    "ruff~=0.16",
    # Without stubs, every `import yaml` in scripts/ is an error under the
    # widened type gate — and silently untyped under the narrow one.
    "types-PyYAML~=6.0",
]

# uv workspace. Internal dependencies resolve from source, so a breaking change
# to a library fails every dependent's CI on the same commit — the monorepo's
# whole value proposition (ADR-001).
[tool.uv.workspace]
members = ["libs/*", "projects/*"]

[tool.uv.sources]
ml-core = { workspace = true }
data-contracts = { workspace = true }
llm-core = { workspace = true }
serving-core = { workspace = true }
feature-defs = { workspace = true }

[tool.ruff]
# `services/` holds code GENERATED from ml-service-template and owned upstream.
# Linting it here judges another repository's conventions with ours, and the
# only ways to make it pass are editing a scaffold — a fork with extra steps,
# which ADR-003 forbids — or loosening our own rules to match. The template's
# CI lints it; C9 still reports upstream defects found in it by name.
line-length = 120
target-version = "py311"
extend-exclude = [
    # Un-rendered generator source: Jinja tokens are not valid Python.
    # Verified by rendering it, not by linting it in place.
    "templates/project",
    # Generated from ml-service-template and owned upstream. See the comment
    # above [tool.ruff].
    "services",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These modules extend sys.path so a sibling module resolves before import.
# The path manipulation MUST run first, so the import cannot move to the top.
"scripts/datasets/fetch.py" = ["E402"]
"tests/test_dataset_registry.py" = ["E402"]

[tool.mypy]
python_version = "3.11"

# `strict` sat in a per-module override listing the five shared libraries, above
# a comment saying libs/ was "checked strictly while projects/ is allowed to be
# looser". Measured, that was not what ran: mypy hoists `strict` out of a
# per-module section and applies it GLOBALLY, then reports the section's module
# list as unused. A file in a module matching none of those patterns was
# receiving `type-arg`, `comparison-overlap`, `unused-ignore` and
# `no-untyped-call` all along, and deleting that one section dropped it to the
# two options set here — the controlled experiment, identical under mypy 1.20.2
# and 2.3.1.
#
# Two things follow. The split this repository documented in three places never
# existed; and the earlier fix that ADDED `feature_defs.*` to that list, framed
# as closing a gap in strict coverage, changed nothing — the list was never what
# was in force. Same shape this repository keeps finding: the declared mechanism
# is not the operating mechanism.
#
# So the option is declared where it acts. Nothing gets weaker: the whole tree
# already passes strict, which is precisely why the misdeclaration was invisible.
#
# `strict` subsumes warn_return_any, disallow_untyped_defs and
# warn_unused_configs, which were listed here separately. Rather than leave them
# as redundant lines that would read as the floor if `strict` were ever removed,
# tests/test_type_gate_enforces_its_config.py runs known-bad code through this
# file and asserts each diagnostic still fires.
strict = true

# The overrides below are per-module and genuinely per-module: unlike `strict`,
# `ignore_missing_imports` and `implicit_reexport` apply to the modules listed.
# The patterns are IMPORTABLE module names, not directory names — a member at
# libs/data-contracts publishes `data_contracts`, and an override written as
# `libs.*` matches nothing while mypy reports it only as a note.
[[tool.mypy.overrides]]
# Optional deep-learning frameworks: seeded when present, reported as
# unavailable when not. Neither is a declared dependency.
module = ["torch.*", "tensorflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed explicitly rather
# than set globally, so a NEW untyped import has to be added here deliberately
# instead of being absorbed in silence.
module = ["pyarrow.*", "pyiceberg.*", "duckdb.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Great Expectations SHIPS py.typed, so it is not an untyped import — it
# re-exports its expectation classes through `great_expectations.expectations`
# without listing them in `__all__`. Adding it to the ignore_missing_imports
# list above would state something false AND discard the types it does provide.
module = ["great_expectations.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "projects"]
norecursedirs = ["templates"]
# Local-stack tests need a running kind cluster, so they are opt-in: the
# default suite must stay runnable on a machine with no Docker.
addopts = "-q -m 'not local and not integration'"
markers = [
    "local: requires the local validation stack (make local-up)",
    "integration: crosses a boundary this code does not own; needs the real dependency",
]

[tool.coverage.run]
omit = [
    # `tests/test_gates_in_a_bare_environment.py` copies the gate scripts into
    # a temporary sandbox and runs them there. Coverage counted each COPY as a
    # separate file, so the same 1,508 statements were measured twice: 2,626
    # total and 58% instead of 75%.
    #
    # The first fix here blamed the generated service's own `scripts/`
    # directory, which was plausible, wrong, and would have left the real
    # cause in place. The report named the sandbox paths outright — reading it
    # took a minute and guessing had already taken three.
    "*/pytest-of-*/*",
    # Generated from ml-service-template and tested in its own repository.
    "services/*",
]

[tool.coverage.report]
fail_under = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.bandit]
# Tests are excluded at the hook level: they legitimately construct bad input,
# and flagging that teaches people to ignore the scanner.
exclude_dirs = ["tests", ".venv", "templates"]
# B404/B603/B607: subprocess use. Every call site here passes a literal command
# defined in this repository, never input — and each one carries a comment
# saying so. Blanket-suppressed rather than per-line so the suppressions do not
# accumulate silently.
# B602 shell=True: `check_implementation_status.py::_verify` runs each
# component's verification command, and several are compound (`ruff check . &&
# ruff format --check .`), which needs a shell. Same argument as B603/B607
# above and the same guarantee: every command is a literal in COMPONENTS,
# never derived from input. The skip list carried that argument for three IDs
# and not for the fourth, so bandit reported it HIGH — correctly, since a
# suppression list is not an argument until it says so.
#
# B101 assert: kept OUT of this list on purpose. Two asserts in
# `lakehouse.py` guarded a snapshot id and were converted to raises, because
# `python -O` strips asserts and a stripped guard returns a result with no
# complaint. The ones bandit still finds are in `scripts/`, which nothing runs
# optimised — and leaving the rule ON means the next one in library code is
# reported rather than absorbed.
skips = ["B404", "B603", "B607", "B602"]
