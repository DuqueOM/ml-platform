[project]
name = "ml-platform"
version = "0.1.0"
description = "Multi-project ML platform monorepo: shared substrate across tabular, deep learning, LLM and agent projects, multi-cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov~=6.0",
    "mypy~=1.13",
    "ruff~=0.8",
]

# uv workspace. Internal dependencies resolve from source, so a breaking change
# to a library fails every dependent's CI on the same commit — the monorepo's
# whole value proposition (ADR-001).
[tool.uv.workspace]
members = ["libs/*", "projects/*"]

[tool.uv.sources]
ml-core = { workspace = true }
data-contracts = { workspace = true }
llm-core = { workspace = true }
serving-core = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# libs/ has the widest blast radius: a type error there reaches every project,
# so it is checked strictly while projects/ is allowed to be looser.
[[tool.mypy.overrides]]
module = "libs.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "projects"]
addopts = "-q"

[tool.coverage.report]
fail_under = 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
