# RBAC — Role-Based Access Control for ML service
# Principle of least privilege: the service account can only read
# ConfigMaps in its own namespace. It has NO access to Kubernetes Secrets:
# runtime secrets come from the cloud secret manager through workload
# identity (common_utils.secrets, ADR-051), so a `secrets: get` grant here
# would be standing access that nothing uses.
#
# For enterprise environments (fintech, healthcare), RBAC is mandatory.
#
# TODO: Replace demand_forecast_serving and {namespace} with your values.
# TODO: Adjust permissions based on what your service actually needs.

---
# Role — defines what actions are allowed
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "demand-forecast-serving-role"
  # Namespace is OWNED by the overlay (kustomization.yaml `namespace:`).
  # Hardcoding it here breaks the overlay's `namespace:` field for any
  # env that uses a different namespace (PR-R2-3, audit R2).
  labels:
    app: "demand-forecast-serving"
    managed-by: kustomize
rules:
  # Read ConfigMaps (e.g., feature flags, config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # No write access — pods should never modify K8s resources

---
# RoleBinding — binds the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "demand-forecast-serving-rolebinding"
  # Namespace owned by overlay; see comment on Role above.
  labels:
    app: "demand-forecast-serving"
    managed-by: kustomize
subjects:
  - kind: ServiceAccount
    name: "demand-forecast-serving-sa"
    # Namespace owned by overlay; see comment on Role above.
roleRef:
  kind: Role
  name: "demand-forecast-serving-role"
  apiGroup: rbac.authorization.k8s.io
