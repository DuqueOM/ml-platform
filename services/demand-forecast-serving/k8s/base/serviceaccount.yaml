apiVersion: v1
kind: ServiceAccount
metadata:
  name: "demand-forecast-serving-sa"
  labels:
    app: "demand-forecast-serving"
  # Cloud identity annotations live in each overlay's patch-serviceaccount.yaml
  # and name the identities Terraform creates (ADR-051):
  #   GKE  iam.gke.io/gcp-service-account: <project_name>-runtime-<env>@<project>.iam.gserviceaccount.com
  #   EKS  eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<project_name>-<service>-irsa-<env>
---
# Drift CronJob identity. Separate from the runtime identity so a compromised
# drift job cannot read secrets or write models (ADR-017, D-31).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "demand-forecast-serving-drift-sa"
  labels:
    app: "demand-forecast-serving-drift"
