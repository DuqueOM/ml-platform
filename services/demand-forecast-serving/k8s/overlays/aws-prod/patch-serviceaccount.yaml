# =============================================================================
# AWS Production — ServiceAccount with IRSA (D-18)
# =============================================================================
# IAM Roles for Service Accounts (IRSA) lets EKS pods authenticate
# to AWS APIs without static credentials.
#
# Setup (one-time): see docs/runbooks/aws-irsa-setup.md
#
# TODO: Replace {AWS_ACCOUNT_ID}, demand_forecast_serving with your actual values.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "demand-forecast-serving-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::{AWS_ACCOUNT_ID}:role/demand-forecast-serving-irsa-role"
