# =============================================================================
# AlertManager rules for ML services
# =============================================================================
# These rules fire when:
#   1. The service is down or error rate spikes (P1 — page on-call)
#   2. Inference latency degrades (P2 — investigate within 1h)
#   3. Drift detection CronJob stops running (P2 — heartbeat alert)
#   4. PSI drift exceeds threshold (P3 — trigger retraining)
#   5. Resource limits are being approached (P4 — capacity planning)
#
# TODO: Replace demand_forecast_serving with your actual service name.
# TODO: Adjust thresholds based on your service's baseline measurements.
# =============================================================================
groups:
  - name: "demand-forecast-serving-service-health"
    rules:
      # --- P1: Service Down ---
      - alert: "demand_forecast_servingServiceDown"
        expr: up{job="demand-forecast-serving"} == 0
        for: 2m
        labels:
          severity: critical
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "demand_forecast_serving is down"
          description: "No healthy pods for demand_forecast_serving in the last 2 minutes."
          runbook_url: "docs/runbooks/runbook-template.md#p1-service-down"

      # --- P1: Error Rate Spike ---
      - alert: "demand_forecast_servingHighErrorRate"
        expr: |
          rate(demand_forecast_serving_requests_total{status="500"}[5m])
          / rate(demand_forecast_serving_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "Error rate > 5% for demand_forecast_serving"
          description: "{{ $value | humanizePercentage }} of requests are failing."
          runbook_url: "docs/runbooks/runbook-template.md#p1-error-rate"

      # --- P2: High Latency ---
      - alert: "demand_forecast_servingHighLatency"
        expr: |
          histogram_quantile(0.95,
            rate(demand_forecast_serving_request_duration_seconds_bucket{endpoint="/predict"}[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          service: "demand-forecast-serving"
          action: ticket
        annotations:
          summary: "P95 latency > 1s for demand_forecast_serving"
          description: "P95 inference latency is {{ $value | humanizeDuration }}."
          runbook_url: "docs/runbooks/runbook-template.md#p2-latency"

  - name: "demand-forecast-serving-drift-detection"
    rules:
      # --- P2: Drift Heartbeat Missing (CronJob broken) ---
      # This is the most critical monitoring rule for ML in production.
      # If the drift detection CronJob stops running, you lose visibility
      # into model degradation. This fires if no run in 48h.
      - alert: "demand_forecast_servingDriftDetectionHeartbeatMissing"
        expr: |
          time() - drift_detection_last_run_timestamp{job="demand-forecast-serving-drift-detection"} > 172800
        for: 10m
        labels:
          severity: warning
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "Drift detection CronJob hasn't run in 48h"
          description: |
            The drift detection CronJob for demand_forecast_serving hasn't pushed metrics
            in {{ $value | humanizeDuration }}. Check CronJob status:
              kubectl get cronjobs -n ml-services
              kubectl describe cronjob demand-forecast-serving-drift-detection -n ml-services
          runbook_url: "docs/runbooks/runbook-template.md#p2-drift-heartbeat"

      # --- P3: PSI Drift Alert ---
      - alert: "demand_forecast_servingDriftAlert"
        expr: "demand_forecast_serving_psi_score > 0.20"
        for: 0m
        labels:
          severity: info
          service: "demand-forecast-serving"
          action: ticket
        annotations:
          summary: "PSI drift detected for {{ $labels.feature }}"
          description: |
            Feature {{ $labels.feature }} has PSI={{ $value }}, above alert threshold 0.20.
            Action: Investigate root cause, then trigger /retrain if confirmed.
          runbook_url: "docs/runbooks/runbook-template.md#p3-drift-alert"

      # --- P3: PSI Drift Warning ---
      - alert: "demand_forecast_servingDriftWarning"
        expr: "demand_forecast_serving_psi_score > 0.10 and demand_forecast_serving_psi_score <= 0.20"
        for: 0m
        labels:
          severity: info
          service: "demand-forecast-serving"
          action: notify
        annotations:
          summary: "Elevated PSI for {{ $labels.feature }}"
          description: "Feature {{ $labels.feature }} PSI={{ $value }}. Monitor closely."
          runbook_url: "docs/runbooks/runbook-template.md#p3-drift-warning"

  - name: "demand-forecast-serving-resources"
    rules:
      # --- P4: CPU Approaching Limit ---
      - alert: "demand_forecast_servingHighCPU"
        expr: |
          rate(container_cpu_usage_seconds_total{container="demand-forecast-serving-predictor"}[5m])
          / container_spec_cpu_quota{container="demand-forecast-serving-predictor"}
          * container_spec_cpu_period{container="demand-forecast-serving-predictor"} > 0.85
        for: 10m
        labels:
          severity: info
          service: "demand-forecast-serving"
          action: notify
        annotations:
          summary: "CPU usage > 85% for demand_forecast_serving"
          description: "Consider scaling up maxReplicas or increasing CPU limit."
          runbook_url: "docs/runbooks/runbook-template.md#p4-high-cpu"

      # --- P4: Pod Restarts ---
      - alert: "demand_forecast_servingPodRestarting"
        expr: rate(kube_pod_container_status_restarts_total{container="demand-forecast-serving-predictor"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "demand_forecast_serving pod restarting"
          description: "Container has restarted {{ $value }} times in the last 15 minutes."
          runbook_url: "docs/runbooks/runbook-template.md#p4-pod-restart"

      # --- P4: Executor Saturation (monitoring-stations audit — Inference station) ---
      - alert: "demand_forecast_servingExecutorSaturated"
        expr: |
          sum(demand_forecast_serving_inference_in_flight)
          / sum(demand_forecast_serving_inference_executor_capacity) >= 1.0
        for: 5m
        labels:
          severity: info
          service: "demand-forecast-serving"
          action: notify
        annotations:
          summary: "Inference executor saturated for demand_forecast_serving"
          description: "Every ThreadPoolExecutor slot has been busy for 5+ minutes — new requests are queueing before they can start."
          runbook_url: "docs/runbooks/runbook-template.md#p4-executor-saturation-capacity-planning"

  - name: "demand-forecast-serving-edge-protection"
    rules:
      # --- P2: Edge Protection Coverage Missing (D-38, ADR-042) ---
      # The last edge-audit run (edge-audit SKILL.md Step 4b) reported this
      # overlay as unprotected. Distinct from the heartbeat alert below:
      # this fires on a KNOWN-BAD verdict, not on staleness.
      - alert: "demand_forecast_servingEdgeProtectionMissing"
        expr: edge_protection_enabled{overlay=~".*-prod"} == 0
        for: 5m
        labels:
          severity: warning
          service: "demand-forecast-serving"
          action: ticket
        annotations:
          summary: "Production overlay {{ $labels.overlay }} has no edge protection wired in"
          description: |
            The last `edge-audit` run for demand_forecast_serving reported overlay
            {{ $labels.overlay }} as unprotected (D-38 violation). Run:
              /edge-setup --overlay {{ $labels.overlay }}
          runbook_url: "docs/runbooks/edge-protection-setup.md#coverage-missing"

      # --- P3: Edge Audit Heartbeat Missing ---
      # If the edge-audit skill/workflow stops running entirely, the coverage
      # panel above goes stale and silently stops catching real drift (e.g. an
      # adopter manually removes the component and nothing re-audits it).
      # Mirrors the drift-detection heartbeat pattern (D-09) for this station.
      - alert: "demand_forecast_servingEdgeAuditHeartbeatMissing"
        expr: time() - edge_protection_last_audit_timestamp > 1209600
        for: 10m
        labels:
          severity: info
          service: "demand-forecast-serving"
          action: notify
        annotations:
          summary: "No edge-audit run in 14 days for demand_forecast_serving"
          description: |
            {{ $labels.overlay }} hasn't been re-audited for edge-protection
            coverage in {{ $value | humanizeDuration }}. Run `edge-audit`
            (or `make edge-setup OVERLAY={{ $labels.overlay }}`) to refresh.
          runbook_url: "docs/runbooks/edge-protection-setup.md#audit-heartbeat"
