groups:
  - name: "demand_forecast_serving_sla"
    rules:
      # P1 — Immediate rollback
      - alert: "HighErrorRate_demand_forecast_serving"
        expr: 'rate(http_requests_total{service="demand-forecast-serving", status=~"5.."}[5m]) > 0.05'
        for: 2m
        labels:
          severity: P1
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "High error rate on demand_forecast_serving"
          description: "Error rate above 5% for 2 minutes. Immediate rollback required."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p1"

      # P1 — Service down
      - alert: "ServiceDown_demand_forecast_serving"
        expr: 'up{job="demand-forecast-serving"} == 0'
        for: 1m
        labels:
          severity: P1
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "demand_forecast_serving is down"
          description: "No scrape target responding for demand_forecast_serving."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p1-service-down"

      # P2 — Drift detection heartbeat missing
      - alert: "DriftHeartbeatMissing_demand_forecast_serving"
        expr: '(time() - drift_detection_last_run_timestamp{job="demand-forecast-serving-drift-detection"}) > 172800'
        for: 5m
        labels:
          severity: P2
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "Drift detection CronJob silent for >48h"
          description: "No drift detection run in 48 hours. CronJob may be broken."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p2"

      # P2 — High latency
      - alert: "HighLatency_demand_forecast_serving"
        expr: 'histogram_quantile(0.95, rate(demand_forecast_serving_prediction_latency_seconds_bucket[5m])) > 1.0'
        for: 5m
        labels:
          severity: P2
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "P95 latency above 1s for demand_forecast_serving"
          description: "P95 prediction latency exceeds SLA. Check event loop blocking or resource limits."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p2-latency"

      # P3 — Critical feature drift
      - alert: "CriticalFeatureDrift_demand_forecast_serving"
        expr: 'demand_forecast_serving_psi_score{feature=~"critical_feature_.*"} > 0.20'
        for: 1h
        labels:
          severity: P3
          service: "demand-forecast-serving"
          action: ticket
        annotations:
          summary: "Critical feature drift detected on demand_forecast_serving"
          description: "PSI > 0.20 on critical feature. Consider retraining."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p3"

      # P4 — Warning drift
      - alert: "WarningFeatureDrift_demand_forecast_serving"
        expr: 'demand_forecast_serving_psi_score > 0.10'
        for: 24h
        labels:
          severity: P4
          service: "demand-forecast-serving"
          action: notify
        annotations:
          summary: "Feature drift warning on demand_forecast_serving"
          description: "PSI > 0.10 sustained for 24h. Monitor closely."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p4-drift-warning"

  - name: "demand_forecast_serving_resources"
    rules:
      - alert: "HighCPU_demand_forecast_serving"
        expr: 'rate(container_cpu_usage_seconds_total{pod=~"demand-forecast-serving-predictor.*"}[5m]) > 0.9'
        for: 10m
        labels:
          severity: P3
          service: "demand-forecast-serving"
          action: ticket
        annotations:
          summary: "High CPU usage on demand_forecast_serving pods"
          description: "CPU above 90% for 10 minutes. HPA should scale."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p3-high-cpu"

      - alert: "PodRestart_demand_forecast_serving"
        expr: 'increase(kube_pod_container_status_restarts_total{pod=~"demand-forecast-serving-predictor.*"}[1h]) > 3'
        for: 5m
        labels:
          severity: P2
          service: "demand-forecast-serving"
          action: page
        annotations:
          summary: "demand_forecast_serving pods restarting frequently"
          description: "More than 3 restarts in the last hour."
          runbook_url: "docs/runbooks/demand-forecast-serving-runbook.md#p2-pod-restart"
