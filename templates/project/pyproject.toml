[project]
name = "{@ project_kebab @}"
version = "0.1.0"
description = "{@ project_name @}"
requires-python = ">=3.11"
# Dependencies point DOWN into libs/ only. A project never depends on another
# project — shared code moves down, never sideways (ADR-001 rule 2), and
# tests/test_dependency_direction.py enforces it.
dependencies = [
    # Declared because `contracts/__init__.py` imports it. Nothing else is
    # declared here: a generated project used to name two or three shared
    # libraries and import none, so every new project began by failing
    # `scripts/check_library_reuse.py` — the dishonesty charter criterion C1
    # forbids, shipped by the generator.
    #
    # `serving-core` is not declared: it holds seven lines and is deliberately
    # empty until a second consumer justifies extracting it (ADR-001, ADR-008).
    # `ml-core` and `llm-core` return the moment the generated code imports
    # them — add the dependency in the commit that adds the import, never before.
    "data-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{@ project_slug @}"]
