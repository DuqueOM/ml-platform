# Mutations every gate and test named below must kill — the harness QA-4 rounds
# twelve and thirteen rebuilt by hand, each time, from a throwaway script.
#
# Round thirteen found that kill rates reported as 11/11, 11/11, 18/18 and 6/6
# held only for mutations someone had already thought of: 12 of 31 new ones
# survived. Committing the list means the next round starts from these and
# adds its own, instead of rediscovering them.
#
#   uv run python scripts/mutation_harness.py            # every mutation
#   uv run python scripts/mutation_harness.py E1 C10-case # by id
#
# `old` must occur exactly once in `file`; tests/test_mutation_harness.py holds
# every entry to that, so a refactor that moves an anchor fails a fast test
# instead of silently shrinking the harness. `expect: survives` is for a
# mutation that only makes a check stricter, and needs a `reason`.
